    // --- MAIN APP COMPONENT ---
    function MainApp() {
      const [view, setView] = useState('loading');
      const [studentName, setStudentName] = useState('');
      const [errorMessage, setErrorMessage] = useState('');
      
      // Admin States
      const [newStudentName, setNewStudentName] = useState('');
      const [netlifyDomain, setNetlifyDomain] = useState('');
      const [records, setRecords] = useState({});

      // Explanation toggle state
      const [openExplanations, setOpenExplanations] = useState({});

      const toggleExplanation = (key) => {
        setOpenExplanations(prev => ({ ...prev, [key]: !prev[key] }));
      };

      // Response States
      const [part1Responses, setPart1Responses] = useState({});
      const [part2Responses, setPart2Responses] = useState({});
      const [part3Responses, setPart3Responses] = useState({});
      const [part4Responses, setPart4Responses] = useState({});

      // Self-check text responses
      const [part1SelfCheck, setPart1SelfCheck] = useState('');
      const [part2SelfCheck, setPart2SelfCheck] = useState('');
      const [part3SelfCheck, setPart3SelfCheck] = useState('');
      const [part4SelfCheck, setPart4SelfCheck] = useState('');

      useEffect(() => {
        const stored = JSON.parse(localStorage.getItem('prepworks_assessments') || '{}');
        setRecords(stored);

        const savedDomain = localStorage.getItem('prepworks_netlify_domain') || '';
        setNetlifyDomain(savedDomain);

        const params = new URLSearchParams(window.location.search);
        const nameParam = params.get('name');

        if (nameParam) {
          // Name travels inside the link itself, so this works on ANY device —
          // no dependency on localStorage records existing on the student's browser.
          setStudentName(decodeURIComponent(nameParam));
          setView('intro');
        } else {
          setView('admin');
        }
      }, []);

      const saveDomain = (e) => {
        const val = e.target.value;
        setNetlifyDomain(val);
        localStorage.setItem('prepworks_netlify_domain', val);
      };

      const generateLink = () => {
        if (!newStudentName.trim()) return alert("Please enter a student name");
        const token = Math.random().toString(36).substring(2, 10);
        const updated = {
          ...records,
          [token]: {
            name: newStudentName,
            status: 'pending',
            createdAt: new Date().toLocaleDateString()
          }
        };
        setRecords(updated);
        localStorage.setItem('prepworks_assessments', JSON.stringify(updated));
        setNewStudentName('');
      };

      const togglePart3Option = (scenarioId, code) => {
        const current = part3Responses[scenarioId] || [];
        const updated = current.includes(code)
          ? current.filter((c) => c !== code)
          : [...current, code];

        setPart3Responses({ ...part3Responses, [scenarioId]: updated });
      };

      // --- SCORING CALCULATORS ---
      const calculateWorkStyleScore = (responses) => {
        let total = 0;
        let count = 0;
        Object.values(responses).forEach(val => { total += val; count++; });
        const avg = count > 0 ? (total / count).toFixed(1) : "N/A";
        return { avg, count };
      };

      const calculateGritScore = (responses) => {
        let total = 0;
        let count = 0;
        const reverseItems = [2, 4, 6, 8, 10];
        for (let i = 1; i <= 10; i++) {
          if (responses[i]) {
            count++;
            if (reverseItems.includes(i)) {
              total += (6 - responses[i]);
            } else {
              total += responses[i];
            }
          }
        }
        const score = count > 0 ? (total / count).toFixed(2) : "N/A";
        return { score, count };
      };

      const calculateLearningProfile = (responses) => {
        const counts = { Visual: 0, Aural: 0, "Read/Write": 0, Kinesthetic: 0 };
        let totalSelections = 0;

        learningApproachItems.forEach((item) => {
          const selectedCodes = responses[item.id] || [];
          selectedCodes.forEach((code) => {
            const match = item.options.find((opt) => opt.code === code);
            if (match) {
              counts[match.type] = (counts[match.type] || 0) + 1;
              totalSelections++;
            }
          });
        });

        return { counts, totalSelections };
      };

      const calculateInterestProfile = (responses) => {
        const totals = { Realistic: 0, Investigative: 0, Artistic: 0, Social: 0, Enterprising: 0, Conventional: 0 };
        interestProfileItems.forEach(item => {
          if (responses[item.id]) {
            totals[item.category] += responses[item.id];
          }
        });
        return totals;
      };

      const submitAssessment = () => {
        setView('summary');
      };

      const getFullUrl = (name) => {
        let baseUrl = netlifyDomain.trim();
        if (!baseUrl) {
          baseUrl = window.location.href.split('?')[0];
        } else {
          if (!baseUrl.startsWith('http://') && !baseUrl.startsWith('https://')) {
            baseUrl = 'https://' + baseUrl;
          }
          if (baseUrl.endsWith('/')) {
            baseUrl = baseUrl.slice(0, -1);
          }
        }
        return `${baseUrl}?name=${encodeURIComponent(name)}`;
      };

      const getEmailLink = (name) => {
        const link = getFullUrl(name);
        const subject = encodeURIComponent(`PrepWorks Global - Profile Assessment Link for ${name}`);
        const body = encodeURIComponent(
          `Hi ${name},\n\nPlease complete your student profile assessment using your personalized link below:\n\n${link}\n\nInstructions:\n1. Click the link above to complete the assessment.\n2. Once finished, click "Download My Results" on the summary screen.\n3. Reply to this email and attach the saved PDF report for our upcoming counseling session.\n\nBest regards,\nPrepWorks Global`
        );
        return `mailto:?subject=${subject}&body=${body}`;
      };

      // Client-side PDF Generation Function
      const handleDownloadPDF = () => {
        const element = document.getElementById('pdf-report-content');
        if (!element) return;

        const sanitizedName = (studentName || "Student").replace(/[^a-zA-Z0-9]/g, "_");
        const filename = `${sanitizedName}_QuizResults.pdf`;

        const opt = {
          margin: 0.5,
          filename: filename,
          image: { type: 'jpeg', quality: 0.98 },
          // scrollX/scrollY: 0 stops html2canvas from offsetting the capture by
          // whatever the page's current scroll position happens to be — without
          // this, if the summary page was scrolled when Download was clicked,
          // the PDF comes out with a blank gap up top and content cut off.
          html2canvas: { scale: 2, useCORS: true, scrollX: 0, scrollY: 0, windowWidth: document.documentElement.scrollWidth },
          jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' },
          // Avoid slicing a section's card in half across a page boundary.
          pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
        };

        // Force the window to the top and let the browser settle before capturing.
        window.scrollTo(0, 0);
        setTimeout(() => {
          html2pdf().set(opt).from(element).save();
        }, 150);
      };

      // Client-side Mailto Generator Function
      const handleEmailResults = () => {
        const name = studentName || "Student";
        const subject = encodeURIComponent(`Quiz Results — ${name}`);
        const body = encodeURIComponent(
          `Hi,\n\nAttached is my assessment results report for review.\n\n[IMPORTANT: Please manually attach the PDF file (${name}_QuizResults.pdf) that you just downloaded before sending this email.]\n\nThank you,\n${name}`
        );
        window.location.href = `mailto:${COUNSELOR_EMAIL}?subject=${subject}&body=${body}`;
      };

      if (view === 'loading') return null;

      if (view === 'error') {
        return (
          <div className="max-w-md mx-auto mt-20 p-6 bg-red-50 border border-red-200 rounded-lg text-center">
            <h2 className="text-xl font-bold text-red-700 mb-2">Access Restricted</h2>
            <p className="text-red-600 text-sm">{errorMessage}</p>
          </div>
        );
      }

      if (view === 'admin') {
        return (
          <div className="max-w-4xl mx-auto p-4 md:p-8">
            <header className="bg-white p-6 rounded-lg shadow-sm border mb-6">
              <h1 className="text-2xl font-bold text-gray-800">PrepWorks Global — Admin Portal</h1>
              <p className="text-sm text-gray-500">Generate and manage single-use student assessment links</p>
            </header>

            {/* Netlify Domain Settings Section */}
            <div className="bg-blue-50 border border-blue-200 p-6 rounded-lg shadow-sm mb-6">
              <h2 className="text-md font-bold text-blue-900 mb-1">🌐 Website Domain Config</h2>
              <p className="text-xs text-blue-700 mb-3">Paste your hosted site URL here (e.g. your GitHub Pages link) so generated links open correctly for students everywhere on the web.</p>
              <input
                type="text"
                placeholder="e.g. https://yourusername.github.io/your-repo-name"
                value={netlifyDomain}
                onChange={saveDomain}
                className="w-full p-2 border border-blue-300 rounded-md text-sm bg-white"
              />
            </div>

            <div className="bg-white p-6 rounded-lg shadow-sm border mb-6">
              <h2 className="text-lg font-bold mb-3">Create New Assessment Link</h2>
              <div className="flex gap-2">
                <input
                  type="text"
                  placeholder="Enter Student Full Name"
                  value={newStudentName}
                  onChange={(e) => setNewStudentName(e.target.value)}
                  className="flex-1 p-2 border rounded-md text-sm"
                />
                <button onClick={generateLink} className="bg-blue-600 text-white px-4 py-2 rounded-md font-medium text-sm hover:bg-blue-700">
                  Generate Link
                </button>
              </div>
            </div>

            <div className="bg-white p-6 rounded-lg shadow-sm border">
              <h2 className="text-lg font-bold mb-3">Student Assessment Links</h2>
              {Object.keys(records).length === 0 ? (
                <p className="text-gray-500 text-sm">No links generated yet.</p>
              ) : (
                <div className="space-y-3">
                  {Object.entries(records).map(([token, item]) => (
                    <div key={token} className="p-3 border rounded-md flex flex-col md:flex-row md:items-center justify-between gap-2 bg-gray-50">
                      <div>
                        <div className="font-bold text-gray-800">{item.name}</div>
                        <div className="text-xs text-gray-500">Status: 
                          <span className={`ml-1 font-semibold ${item.status === 'completed' ? 'text-green-600' : 'text-amber-600'}`}>
                            {item.status}
                          </span>
                        </div>
                      </div>
                      <div className="flex items-center gap-2">
                        {item.status === 'pending' ? (
                          <>
                            <a
                              href={getEmailLink(item.name)}
                              className="bg-blue-600 text-white text-xs px-3 py-2 rounded font-medium hover:bg-blue-700 flex items-center gap-1"
                            >
                              📧 Email to Student
                            </a>
                            <a
                              href={getFullUrl(item.name)}
                              target="_blank"
                              className="bg-gray-200 text-gray-700 text-xs px-3 py-2 rounded font-medium hover:bg-gray-300"
                            >
                              ▶ Open Link
                            </a>
                          </>
                        ) : (
                          <span className="text-xs text-gray-400 italic">Completed</span>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        );
      }

      if (view === 'intro') {
        return (
          <div className="max-w-2xl mx-auto mt-10 p-6 bg-white rounded-lg shadow-sm border">
            <h1 className="text-2xl font-bold text-gray-800 mb-2">Welcome, {studentName}!</h1>
            <p className="text-gray-600 mb-6 text-sm">You have been invited to complete your profile assessment. Every single question across all sections features a 💡 <strong>Explain the Question</strong> button with a Spider-Man movie example to help you understand!</p>
            <button
              onClick={() => setView('assessment')}
              className="w-full bg-blue-600 text-white py-3 rounded-md font-bold text-center hover:bg-blue-700"
            >
              Start Assessment
            </button>
          </div>
        );
      }

      if (view === 'assessment') {
        return (
          <div className="max-w-4xl mx-auto p-4 md:p-8 space-y-8">
            <div className="bg-white p-6 md:p-8 rounded-lg shadow-sm border space-y-10">
              
              {/* PART 1 */}
              <div>
                <h2 className="text-xl font-bold text-gray-800 border-b pb-3 mb-4">PART 1 - Work Style (32 items)</h2>
                <div className="space-y-4">
                  {workStyleItems.map((item) => {
                    const expKey = `p1_${item.id}`;
                    const isOpen = openExplanations[expKey];
                    return (
                      <div key={item.id} className="pt-2 border-b border-gray-100 pb-3">
                        <div className="flex justify-between items-start gap-2">
                          <p className="text-gray-800 font-medium text-sm flex-1">{item.id}. {item.text}</p>
                          <button
                            type="button"
                            onClick={() => toggleExplanation(expKey)}
                            className="text-xs bg-indigo-50 text-indigo-700 font-semibold px-2 py-1 rounded hover:bg-indigo-100 transition-colors whitespace-nowrap"
                          >
                            {isOpen ? "Hide Explanation" : "💡 Explain the Question"}
                          </button>
                        </div>

                        {isOpen && (
                          <div className="mt-3 p-4 bg-indigo-50 border border-indigo-200 rounded-md text-xs text-indigo-900 space-y-2">
                            <p className="font-bold text-indigo-950">💡 {item.explanation}</p>
                            <p className="leading-relaxed">{item.example}</p>
                          </div>

                        <div className="grid grid-cols-5 gap-2 mt-3">
                          {likertLabels.map(({ num, label }) => (
                            <button
                              key={num}

                              onClick={() => setPart1Responses({ ...part1Responses, [item.id]: num })}

                                part1Responses[item.id] === num ? 'bg-blue-600 text-white font-bold' : 'bg-gray-50 hover:bg-gray-100 text-gray-700'
                              }`}
                            >
                              {label}
                            </button>
                          ))}
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* Self Check Part 1 */}
                <div className="mt-6 bg-slate-50 p-4 rounded-md border">
                  <label className="block text-xs font-bold text-gray-700 mb-1">
                    Self-check (not scored): In your own words, would you describe yourself as more of an introvert or an extrovert?
                  </label>
                  <input

                    onChange={(e) => setPart1SelfCheck(e.target.value)}

                    className="w-full p-2 border rounded-md text-xs"
                  />
                </div>
              </div>

              {/* PART 2 */}
              <div className="pt-4 border-t">
                <h2 className="text-xl font-bold text-gray-800 border-b pb-3 mb-4">PART 2 - Grit (10 items)</h2>
                <div className="space-y-4">
                  {gritItems.map((item) => {
                    const expKey = `p2_${item.id}`;
                    const isOpen = openExplanations[expKey];
                    return (
                      <div key={item.id} className="pt-2 border-b border-gray-100 pb-3">
                        <div className="flex justify-between items-start gap-2">
                          <p className="text-gray-800 font-medium text-sm flex-1">{item.id}. {item.text}</p>
                          <button
                            type="button"
                            onClick={() => toggleExplanation(expKey)}
                            className="text-xs bg-indigo-50 text-indigo-700 font-semibold px-2 py-1 rounded hover:bg-indigo-100 transition-colors whitespace-nowrap"
                          >
                            {isOpen ? "Hide Explanation" : "💡 Explain the Question"}
                          </button>
                        </div>

                        {isOpen && (
                          <div className="mt-3 p-4 bg-indigo-50 border border-indigo-200 rounded-md text-xs text-indigo-900 space-y-2">
                            <p className="font-bold text-indigo-950">💡 {item.explanation}</p>
                            <p className="leading-relaxed">{item.example}</p>
                          </div>
                        )}

                        <div className="grid grid-cols-5 gap-2 mt-3">
                          {likertLabels.map(({ num, label }) => (
                            <button
                              key={num}
                              type="button"
                              onClick={() => setPart2Responses({ ...part2Responses, [item.id]: num })}
                              className={`p-2 text-xs border rounded-md text-center transition-colors ${
                                part2Responses[item.id] === num ? 'bg-blue-600 text-white font-bold' : 'bg-gray-50 hover:bg-gray-100 text-gray-700'
                              }`}
                            >
                              {label}
                            </button>
                          ))}
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* Self Check Part 2 */}
                <div className="mt-6 bg-slate-50 p-4 rounded-md border">
                  <label className="block text-xs font-bold text-gray-700 mb-1">

                  </label>
                  <input
                    type="text"
                    value={part2SelfCheck}
                    onChange={(e) => setPart2SelfCheck(e.target.value)}

                    className="w-full p-2 border rounded-md text-xs"
                  />
                </div>
              </div>

              {/* PART 3: LEARNING APPROACH */}
              <div className="pt-4 border-t">
                <h2 className="text-xl font-bold text-gray-800 pb-1">PART 3 - Learning Approach (10 scenarios)</h2>
                <p className="text-xs text-blue-600 mb-4">💡 Select ALL options that fit how you would actually behave in each scenario.</p>
                
                {learningApproachItems.map((item) => {
                  const selectedCodes = part3Responses[item.id] || [];
                  const expKey = `p3_${item.id}`;
                  const isOpen = openExplanations[expKey];

                  return (
                    <div key={item.id} className="mb-6 bg-gray-50 p-4 rounded-md border">
                      <div className="flex justify-between items-start gap-2 mb-3">
                        <p className="text-sm font-bold text-gray-800 flex-1">{item.scenario}</p>
                        <button
                          type="button"
                          onClick={() => toggleExplanation(expKey)}

                        >
                          {isOpen ? "Hide Explanation" : "💡 Explain the Question"}
                        </button>
                      </div>

                      {isOpen && (
                        <div className="mb-4 p-4 bg-indigo-50 border border-indigo-200 rounded-md text-xs text-indigo-900 space-y-2">

                      <div className="space-y-2">

                              key={num}
                              type="button"
                              onClick={() => setPart4Responses({ ...part4Responses, [item.id]: num })}
                              className={`p-2 text-xs border rounded-md text-center transition-colors ${
                                part4Responses[item.id] === num ? 'bg-blue-600 text-white font-bold' : 'bg-gray-50 hover:bg-gray-100 text-gray-700'
                              }`}
                            >
                              {label}
                            </button>
                          ))}
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* Self Check Part 4 */}
                <div className="mt-6 bg-slate-50 p-4 rounded-md border">
                  <label className="block text-xs font-bold text-gray-700 mb-1">
                    Self-check (not scored): If you didn't have to think about salary or family expectations at all, what kind of work would genuinely excite you?
                  </label>
                  <input
                    type="text"
                    value={part4SelfCheck}
                    onChange={(e) => setPart4SelfCheck(e.target.value)}
                    placeholder="Enter your thoughts..."
                    className="w-full p-2 border rounded-md text-xs"
                  />
                </div>
              </div>

              <button
                onClick={submitAssessment}
                className="w-full mt-8 bg-green-600 text-white py-4 rounded-md font-bold text-lg hover:bg-green-700 transition-colors shadow-md"
              >
                Submit Complete Assessment
              </button>
            </div>
          </div>
        );
      }

      // --- RESULTS SUMMARY VIEW (ALL PARTS INCLUDED) ---
      if (view === 'summary') {
        const p1Score = calculateWorkStyleScore(part1Responses);
        const p2Score = calculateGritScore(part2Responses);
        const p3Profile = calculateLearningProfile(part3Responses);
        const p4Totals = calculateInterestProfile(part4Responses);

        return (
          <div className="max-w-3xl mx-auto my-8 p-6 md:p-8 bg-white rounded-lg shadow-sm border space-y-6 print-shadow-none">
            
            {/* WRAPPER TARGETED FOR PDF GENERATION */}
            <div id="pdf-report-content" className="p-4 bg-white space-y-6">
              <div className="text-center space-y-2 border-b pb-4">
                <div className="text-green-500 text-5xl no-print">✓</div>
                <h1 className="text-xl font-bold text-blue-900 uppercase tracking-wide">PrepWorks Global Student Assessment</h1>
                <h2 className="text-2xl font-bold text-gray-800">Assessment Diagnostic Summary</h2>
                <div className="text-xs text-gray-500 mt-2 flex justify-center gap-6">
                  <span><strong>Student Name:</strong> {studentName || 'N/A'}</span>
                  <span><strong>Date:</strong> {new Date().toLocaleDateString()}</span>
                </div>
              </div>

              {/* PART 1 SUMMARY */}
              <div className="bg-slate-50 p-5 rounded-lg border text-left space-y-2" style={{ breakInside: 'avoid', pageBreakInside: 'avoid' }}>
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-gray-800">Part 1: Work Style Overview</h3>
                  <span className="text-xs font-semibold bg-blue-100 text-blue-800 px-2.5 py-1 rounded">Average: {p1Score.avg} / 5</span>
                </div>
                <p className="text-xs text-gray-600">Completed items: {p1Score.count} / 32</p>
                {part1SelfCheck && (
                  <p className="text-xs text-gray-700 italic border-l-2 border-blue-400 pl-2 mt-2">
                    "Self Check: {part1SelfCheck}"
                  </p>
                )}
              </div>

              {/* PART 2 SUMMARY */}
              <div className="bg-slate-50 p-5 rounded-lg border text-left space-y-2" style={{ breakInside: 'avoid', pageBreakInside: 'avoid' }}>
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-gray-800">Part 2: Grit Score</h3>
                  <span className="text-xs font-semibold bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded">Overall Score: {p2Score.score} / 5</span>
                </div>
                <p className="text-xs text-gray-600">Perseverance & consistency score across {p2Score.count} items.</p>
                {part2SelfCheck && (
                  <p className="text-xs text-gray-700 italic border-l-2 border-emerald-400 pl-2 mt-2">
                    "Self Check: {part2SelfCheck}"
                  </p>
                )}
              </div>

              {/* PART 3 SUMMARY */}
              <div className="bg-slate-50 p-5 rounded-lg border text-left space-y-4" style={{ breakInside: 'avoid', pageBreakInside: 'avoid' }}>
                <h3 className="font-bold text-gray-800 border-b pb-2">Part 3: Learning Approach Breakdown</h3>
                <div className="space-y-3">
                  {Object.entries(p3Profile.counts).map(([style, count]) => {
                    const percentage = p3Profile.totalSelections > 0 ? Math.round((count / p3Profile.totalSelections) * 100) : 0;
                    return (
                      <div key={style} className="space-y-1">
                        <div className="flex justify-between text-xs font-semibold text-gray-700">
                          <span>{style}</span>
                          <span>{count} selections ({percentage}%)</span>
                        </div>
                        <div className="w-full bg-gray-200 rounded-full h-2.5">
                          <div className="bg-indigo-600 h-2.5 rounded-full" style={{ width: `${percentage}%` }}></div>
                        </div>
                      </div>
                    );
                  })}
                </div>
                {part3SelfCheck && (
                  <p className="text-xs text-gray-700 italic border-l-2 border-indigo-400 pl-2 mt-2">
                    "Self Check: {part3SelfCheck}"
                  </p>
                )}
              </div>

              {/* PART 4 SUMMARY */}
              <div className="bg-slate-50 p-5 rounded-lg border text-left space-y-4" style={{ breakInside: 'avoid', pageBreakInside: 'avoid' }}>
                <h3 className="font-bold text-gray-800 border-b pb-2">Part 4: Interest Profile (Holland Codes)</h3>
                <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                  {Object.entries(p4Totals).map(([cat, val]) => (
                    <div key={cat} className="p-3 bg-white border rounded text-center">
                      <div className="text-xs text-gray-500 font-medium">{cat}</div>
                      <div className="text-lg font-bold text-gray-800">{val} pts</div>
                    </div>
                  ))}
                </div>
                {part4SelfCheck && (
                  <p className="text-xs text-gray-700 italic border-l-2 border-purple-400 pl-2 mt-2">
                    "Self Check: {part4SelfCheck}"
                  </p>
                )}
              </div>
            </div>

            {/* DOWNLOAD AND EMAIL BUTTON ACTION BAR */}
            <div className="no-print pt-4 border-t flex flex-col sm:flex-row gap-3 justify-center">
              <button
                onClick={handleDownloadPDF}
                className="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-md flex items-center justify-center gap-2 transition-colors shadow-sm text-sm"
              >
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                Download My Results
              </button>

              <button
                onClick={handleEmailResults}
                className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-4 rounded-md flex items-center justify-center gap-2 transition-colors shadow-sm text-sm"
              >
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
                Email My Results
              </button>
            </div>

          </div>
        );
      }

      return null;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<MainApp />);
  </script>
</body>
</html>
