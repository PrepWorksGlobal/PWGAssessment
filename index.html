      { id: 20, text: "Resolve a conflict or disagreement between two people.", category: "Social", explanation: "Do you naturally step in to help friends resolve petty arguments?", example: "Clarity Crew Example: Dev helping two friends settle an argument over a cricket match." },
      { id: 21, text: "Spend most of your working day directly helping or advising people.", category: "Social", explanation: "Do you find fulfillment in guiding and helping people every day?", example: "Clarity Crew Example: Paati spending her days guiding visitors at the community centre." },
      { id: 22, text: "Organise a group activity or event for others.", category: "Social", explanation: "Do you like planning class parties, games, or group study sessions?", example: "Clarity Crew Example: Dev organising the class farewell party." },
      { id: 23, text: "Counsel or support someone going through a difficult situation.", category: "Social", explanation: "Do friends come to you for personal advice when feeling low?", example: "Clarity Crew Example: Meera listening patiently to a friend who is upset about exam results." },
      { id: 24, text: "Lead a discussion or facilitate a group conversation.", category: "Social", explanation: "Do you like moderating group discussions or leading team meetings?", example: "Clarity Crew Example: Dev leading a group discussion so that everyone gets a turn to speak." },

      { id: 25, text: "Pitch an idea and persuade others to back it.", category: "Enterprising", explanation: "Do you enjoy convincing classmates or teachers to support your ideas?", example: "Clarity Crew Example: Dev convincing the principal to approve a new astronomy club." },
      { id: 26, text: "Take the lead on a project with real ownership over the outcome.", category: "Enterprising", explanation: "Do you like taking charge as group leader for major assignments?", example: "Clarity Crew Example: Meera taking charge of the class project and owning the final result." },
      { id: 27, text: "Negotiate a deal or a difficult conversation.", category: "Enterprising", explanation: "Do you enjoy bargaining or negotiating solutions where both sides win?", example: "Clarity Crew Example: Dev bargaining at the market for a fair price on cricket gear." },
      { id: 28, text: "Start or run your own venture or initiative.", category: "Enterprising", explanation: "Do you dream of starting your own club, business, or project?", example: "Clarity Crew Example: Zoya starting a small business selling handmade phone stands." },
      { id: 29, text: "Compete for a target, a client, or a result.", category: "Enterprising", explanation: "Does competing for top ranks or sports prizes energize you?", example: "Clarity Crew Example: Meera competing hard to win the inter-school debate trophy." },
      { id: 30, text: "Convince a sceptical audience to change their mind.", category: "Enterprising", explanation: "Do you enjoy persuading people who initially disagree with you?", example: "Clarity Crew Example: Dev persuading classmates who disagree to vote for his idea." },

      { id: 31, text: "Organise and maintain accurate records or files.", category: "Conventional", explanation: "Do you like keeping organized files, folder labels, and neat notes?", example: "Clarity Crew Example: Dev keeping the class library's borrowing records neat and up to date." },
      { id: 32, text: "Follow a clear, established process from start to finish.", category: "Conventional", explanation: "Do you like following reliable, set routines for your daily work?", example: "Clarity Crew Example: Meera following the lab safety steps in exactly the right order." },
      { id: 33, text: "Check work carefully for errors or inconsistencies.", category: "Conventional", explanation: "Do you carefully double-check your exam papers for small mistakes?", example: "Clarity Crew Example: Meera checking her answer sheet twice for small mistakes." },
      { id: 34, text: "Work with numbers, spreadsheets, or structured data entry.", category: "Conventional", explanation: "Do you like working with structured numbers, budgets, or tables?", example: "Clarity Crew Example: Kiran entering the class fundraiser money into a spreadsheet." },
      { id: 35, text: "Keep a schedule, budget, or set of accounts on track.", category: "Conventional", explanation: "Do you like managing your monthly pocket money or study schedules?", example: "Clarity Crew Example: Kiran keeping track of his monthly pocket money and study hours." },
      { id: 36, text: "Work in a role with clearly defined rules and procedures.", category: "Conventional", explanation: "Do you prefer environments where rules and expectations are crystal clear?", example: "Clarity Crew Example: Kiran working as a library assistant, with clear rules for shelving every book." }
    ];

    const TOTAL_QUESTIONS = 88; // 32 + 10 + 10 + 36

    // --- HELPER FOR SAFE LOCALSTORAGE ---
    const safeStorage = {
      getItem: (key) => {
        try { return localStorage.getItem(key); } catch (e) { return null; }
      },
      setItem: (key, val) => {
        try { localStorage.setItem(key, val); } catch (e) {}
      },
      removeItem: (key) => {
        try { localStorage.removeItem(key); } catch (e) {}
      }
    };

    // --- POST TO GOOGLE SHEET HELPER ---
    const sendToGoogleSheet = (payload) => {
      if (!SHEET_URL) return;
      try {
        fetch(SHEET_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        }).catch(() => {});
      } catch (e) {}
    };

    // --- MAIN APP COMPONENT ---
    function MainApp() {
      const [view, setView] = useState('signup'); // 'signup', 'resumePrompt', 'assessment', 'summary'
      
      // Sign-up Form State
      const [fullName, setFullName] = useState('');
      const [email, setEmail] = useState('');
      const [countryCode, setCountryCode] = useState('+91');
      const [whatsappNumber, setWhatsappNumber] = useState('');
      const [stage, setStage] = useState('');
      const [consent, setConsent] = useState(false);
      const [source, setSource] = useState('direct');
      const [formError, setFormError] = useState('');

      // Saved State Prompt
      const [savedState, setSavedState] = useState(null);

      // Explanation toggle state
      const [openExplanations, setOpenExplanations] = useState({});

      const toggleExplanation = (key) => {
        setOpenExplanations(prev => ({ ...prev, [key]: !prev[key] }));
      };

      // Response States
      const [part1Responses, setPart1Responses] = useState({});
      const [part2Responses, setPart2Responses] = useState({});
      const [part3Responses, setPart3Responses] = useState({});
      const [part4Responses, setPart4Responses] = useState({});

      // Self-check text responses
      const [part1SelfCheck, setPart1SelfCheck] = useState('');
      const [part2SelfCheck, setPart2SelfCheck] = useState('');
      const [part3SelfCheck, setPart3SelfCheck] = useState('');
      const [part4SelfCheck, setPart4SelfCheck] = useState('');

      // Initialize parameters, URL prefilling & check saved progress
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const nameParam = params.get('name');
        const emailParam = params.get('email');
        const srcParam = params.get('src');

        if (nameParam) setFullName(decodeURIComponent(nameParam));
        if (emailParam) setEmail(decodeURIComponent(emailParam));
        if (srcParam) setSource(decodeURIComponent(srcParam));

        // Check LocalStorage progress
        const rawSaved = safeStorage.getItem('prepworks_clarity_scan_saved');
        if (rawSaved) {
          try {
            const parsed = JSON.parse(rawSaved);
            if (parsed && (parsed.view === 'assessment' || parsed.view === 'summary')) {
              setSavedState(parsed);
              setView('resumePrompt');
            }
          } catch (e) {}
        }
      }, []);

      // Auto-save progress on changes
      useEffect(() => {
        if (view === 'assessment') {
          const stateToSave = {
            view: 'assessment',
            userInfo: { fullName, email, countryCode, whatsappNumber, stage, consent, source },
            part1Responses,
            part2Responses,
            part3Responses,
            part4Responses,
            part1SelfCheck,
            part2SelfCheck,
            part3SelfCheck,
            part4SelfCheck
          };
          safeStorage.setItem('prepworks_clarity_scan_saved', JSON.stringify(stateToSave));
        }
      }, [
        view, fullName, email, countryCode, whatsappNumber, stage, consent, source,
        part1Responses, part2Responses, part3Responses, part4Responses,
        part1SelfCheck, part2SelfCheck, part3SelfCheck, part4SelfCheck
      ]);

      const handleResume = () => {
        if (!savedState) return;
        const u = savedState.userInfo || {};
        setFullName(u.fullName || '');
        setEmail(u.email || '');
        setCountryCode(u.countryCode || '+91');
        setWhatsappNumber(u.whatsappNumber || '');
        setStage(u.stage || '');
        setConsent(u.consent || false);
        setSource(u.source || 'direct');

        setPart1Responses(savedState.part1Responses || {});
        setPart2Responses(savedState.part2Responses || {});
        setPart3Responses(savedState.part3Responses || {});
        setPart4Responses(savedState.part4Responses || {});

        setPart1SelfCheck(savedState.part1SelfCheck || '');
        setPart2SelfCheck(savedState.part2SelfCheck || '');
        setPart3SelfCheck(savedState.part3SelfCheck || '');
        setPart4SelfCheck(savedState.part4SelfCheck || '');

        setView(savedState.view || 'assessment');
      };

      const handleStartFresh = () => {
        safeStorage.removeItem('prepworks_clarity_scan_saved');
        setSavedState(null);
        setView('signup');
      };

      const validateSignup = (e) => {
        e.preventDefault();
        setFormError('');

        if (!fullName.trim()) return setFormError('Please enter your full name.');
        if (!email.trim()) return setFormError('Please enter your email address.');
        
        // Basic Email Format Validation
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email.trim())) {
          return setFormError('Please enter a valid email address.');
        }

        if (!whatsappNumber.trim()) return setFormError('Please enter your WhatsApp number.');
        if (!stage) return setFormError('Please select your current stage.');
        if (!consent) return setFormError('You must agree to the storage and contact terms to proceed.');

        const fullWhatsapp = `${countryCode}${whatsappNumber.trim()}`;

        // Fire POST event: "started"
        sendToGoogleSheet({
          event: "started",
          name: fullName.trim(),
          email: email.trim(),
          whatsapp: fullWhatsapp,
          stage: stage,
          source: source,
          consent: consent
        });

        setView('assessment');
      };

      const togglePart3Option = (scenarioId, code) => {
        const current = part3Responses[scenarioId] || [];
        const updated = current.includes(code)
          ? current.filter((c) => c !== code)
          : [...current, code];

        setPart3Responses({ ...part3Responses, [scenarioId]: updated });
      };

      // --- SCORING CALCULATORS ---
      const calculateWorkStyleScore = (responses) => {
        let total = 0;
        let count = 0;
        Object.values(responses).forEach(val => { total += val; count++; });
        const avg = count > 0 ? (total / count).toFixed(1) : "N/A";
        return { avg, count };
      };

      const calculateGritScore = (responses) => {
        let total = 0;
        let count = 0;
        const reverseItems = [2, 4, 6, 8, 10];
        for (let i = 1; i <= 10; i++) {
          if (responses[i]) {
            count++;
            if (reverseItems.includes(i)) {
              total += (6 - responses[i]);
            } else {
              total += responses[i];
            }
          }
        }
        const score = count > 0 ? (total / count).toFixed(2) : "N/A";
        return { score, count };
      };

      const calculateLearningProfile = (responses) => {
        const counts = { Visual: 0, Aural: 0, "Read/Write": 0, Kinesthetic: 0 };
        let totalSelections = 0;

        learningApproachItems.forEach((item) => {
          const selectedCodes = responses[item.id] || [];
          selectedCodes.forEach((code) => {
            const match = item.options.find((opt) => opt.code === code);
            if (match) {
              counts[match.type] = (counts[match.type] || 0) + 1;
              totalSelections++;
            }
          });
        });

        return { counts, totalSelections };
      };

      const calculateInterestProfile = (responses) => {
        const totals = { Realistic: 0, Investigative: 0, Artistic: 0, Social: 0, Enterprising: 0, Conventional: 0 };
        interestProfileItems.forEach(item => {
          if (responses[item.id]) {
            totals[item.category] += responses[item.id];
          }
        });
        return totals;
      };

      const getSkippedItemIds = (items, responses, isMultiSelect) => {
        const skipped = [];
        items.forEach((item) => {
          const val = responses[item.id];
          const isEmpty = isMultiSelect ? (!val || val.length === 0) : (val === undefined);
          if (isEmpty) skipped.push(item.id);
        });
        return skipped;
      };

      const countAnsweredQuestions = () => {
        let count = 0;
        workStyleItems.forEach(item => { if (part1Responses[item.id] !== undefined) count++; });
        gritItems.forEach(item => { if (part2Responses[item.id] !== undefined) count++; });
        learningApproachItems.forEach(item => { if (part3Responses[item.id] && part3Responses[item.id].length > 0) count++; });
        interestProfileItems.forEach(item => { if (part4Responses[item.id] !== undefined) count++; });
        return count;
      };

      const submitAssessment = () => {
        const p1Score = calculateWorkStyleScore(part1Responses);
        const p2Score = calculateGritScore(part2Responses);
        const p3Profile = calculateLearningProfile(part3Responses);
        const p4Totals = calculateInterestProfile(part4Responses);

        const fullWhatsapp = `${countryCode}${whatsappNumber.trim()}`;

        // Fire POST event: "completed"
        sendToGoogleSheet({
          event: "completed",
          name: fullName.trim(),
          email: email.trim(),
          whatsapp: fullWhatsapp,
          stage: stage,
          source: source,
          consent: consent,
          scores: {
            workStyleAvg: p1Score.avg,
            gritScore: p2Score.score,
            learningProfileCounts: p3Profile.counts,
            interestHollandScores: p4Totals
          },
          answers: {
            part1WorkStyle: part1Responses,
            part2Grit: part2Responses,
            part3LearningApproach: part3Responses,
            part4InterestProfile: part4Responses,
            selfChecks: {
              part1: part1SelfCheck,
              part2: part2SelfCheck,
              part3: part3SelfCheck,
              part4: part4SelfCheck
            }
          }
        });

        safeStorage.removeItem('prepworks_clarity_scan_saved');
        setView('summary');
      };

      // Client-side PDF Generation Function
      const handleDownloadPDF = () => {
        const element = document.getElementById('pdf-report-content');
        if (!element) return;

        const sanitizedName = (fullName || "Student").replace(/[^a-zA-Z0-9]/g, "_");
        const filename = `${sanitizedName}_ClarityScan_Results.pdf`;

        const opt = {
          margin: 0.5,
          filename: filename,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2, useCORS: true, scrollX: 0, scrollY: 0, windowWidth: document.documentElement.scrollWidth },
          jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' },
          pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
        };

        window.scrollTo(0, 0);
        setTimeout(() => {
          html2pdf().set(opt).from(element).save();
        }, 150);
      };

      // --- RESUME PROMPT SCREEN ---
      if (view === 'resumePrompt') {
        return (
          <div className="max-w-md mx-auto mt-16 p-6 bg-white rounded-lg shadow-sm border text-center space-y-4">
            <h2 className="text-xl font-bold text-gray-800">Welcome Back!</h2>
            <p className="text-gray-600 text-sm">We found your previous in-progress Clarity Scan assessment.</p>
            <div className="flex flex-col gap-2 pt-2">
              <button
                onClick={handleResume}
                className="w-full bg-blue-600 text-white py-2.5 rounded-md font-semibold hover:bg-blue-700 transition-colors text-sm"
              >
                Continue where you left off
              </button>
              <button
                onClick={handleStartFresh}
                className="w-full bg-gray-100 text-gray-700 py-2.5 rounded-md font-semibold hover:bg-gray-200 transition-colors text-sm"
              >
                Start again
              </button>
            </div>
          </div>
        );
      }

      // --- CHANGE 1: SIGN-UP SCREEN ---
      if (view === 'signup') {
        return (
          <div className="max-w-lg mx-auto mt-8 p-6 bg-white rounded-lg shadow-sm border space-y-6">
            <div className="text-center space-y-2 border-b pb-4">
              <h1 className="text-2xl font-bold text-blue-900">PrepWorks Global</h1>
              <h2 className="text-lg font-bold text-gray-800">Clarity Scan: Student Profile Assessment</h2>
              <p className="text-xs text-gray-500">Please enter your details below to begin your self-contained assessment.</p>
            </div>

            {formError && (
              <div className="p-3 bg-red-50 border border-red-200 rounded text-red-700 text-xs font-medium">
                {formError}
              </div>
            )}

            <form onSubmit={validateSignup} className="space-y-4 text-left">
              <div>
                <label className="block text-xs font-bold text-gray-700 mb-1">Full Name *</label>
                <input
                  type="text"
                  value={fullName}
                  onChange={(e) => setFullName(e.target.value)}
                  placeholder="e.g. Rahul Sharma"
                  className="w-full p-2.5 border rounded-md text-sm focus:ring-2 focus:ring-blue-500 outline-none"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-gray-700 mb-1">Email Address *</label>
                <input
                  type="email"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  placeholder="e.g. rahul@example.com"
                  className="w-full p-2.5 border rounded-md text-sm focus:ring-2 focus:ring-blue-500 outline-none"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-gray-700 mb-1">WhatsApp Number *</label>
                <div className="flex gap-2">
                  <input
                    type="text"
                    value={countryCode}
                    onChange={(e) => setCountryCode(e.target.value)}
                    className="w-20 p-2.5 border rounded-md text-sm text-center font-medium bg-gray-50"
                  />
                  <input
                    type="tel"
                    value={whatsappNumber}
                    onChange={(e) => setWhatsappNumber(e.target.value)}
                    placeholder="9876543210"
                    className="flex-1 p-2.5 border rounded-md text-sm focus:ring-2 focus:ring-blue-500 outline-none"
                  />
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-gray-700 mb-1">Current Stage *</label>
                <select
                  value={stage}
                  onChange={(e) => setStage(e.target.value)}
                  className="w-full p-2.5 border rounded-md text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white"
                >
                  <option value="">Select your stage...</option>
                  <option value="School student">School student</option>
                  <option value="College student">College student</option>
                  <option value="Recent graduate">Recent graduate</option>
                  <option value="Working professional">Working professional</option>
                  <option value="Parent of a student">Parent of a student</option>
                </select>
              </div>

              <div className="pt-2">
                <label className="flex items-start gap-2.5 cursor-pointer">
                  <input
                    type="checkbox"
                    checked={consent}
                    onChange={(e) => setConsent(e.target.checked)}
                    className="mt-0.5 h-4 w-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500"
                  />
                  <span className="text-xs text-gray-600 leading-relaxed">
                    I agree that PrepWorksGlobal may store my answers and contact me about my results. If I am under 18, my parent or guardian has agreed. *
                  </span>
                </label>
              </div>

              <button
                type="submit"
                className="w-full mt-4 bg-blue-600 text-white py-3 rounded-md font-bold text-center hover:bg-blue-700 transition-colors shadow-sm text-sm"
              >
                Start Assessment
              </button>
            </form>
          </div>
        );
      }

      // --- ASSESSMENT SCREEN ---
      if (view === 'assessment') {
        const answeredCount = countAnsweredQuestions();
        const progressPercent = Math.round((answeredCount / TOTAL_QUESTIONS) * 100);

        return (
          <div className="max-w-4xl mx-auto p-4 md:p-8 space-y-6">
            
            {/* Sticky Mobile-Friendly Progress Bar */}
            <div className="sticky top-0 z-10 bg-white p-4 rounded-lg shadow-sm border">
              <div className="flex justify-between items-center text-xs font-bold text-gray-700 mb-1.5">
                <span>Assessment Progress</span>
                <span>Question {answeredCount} of {TOTAL_QUESTIONS} ({progressPercent}%)</span>
              </div>
              <div className="w-full bg-gray-200 rounded-full h-2.5">
                <div
                  className="bg-blue-600 h-2.5 rounded-full transition-all duration-300"
                  style={{ width: `${progressPercent}%` }}
                ></div>
              </div>
            </div>

            <div className="bg-white p-6 md:p-8 rounded-lg shadow-sm border space-y-10">
              
              {/* PART 1 */}
              <div>
                <h2 className="text-xl font-bold text-gray-800 border-b pb-3 mb-4">PART 1 - Work Style (32 items)</h2>
                <div className="space-y-4">
                  {workStyleItems.map((item) => {
                    const expKey = `p1_${item.id}`;
                    const isOpen = openExplanations[expKey];
                    return (
                      <div key={item.id} className="pt-2 border-b border-gray-100 pb-3">
                        <div className="flex justify-between items-start gap-2">
                          <p className="text-gray-800 font-medium text-sm flex-1">{item.id}. {item.text}</p>
                          <button
                            type="button"
                            onClick={() => toggleExplanation(expKey)}
                            className="text-xs bg-indigo-50 text-indigo-700 font-semibold px-2 py-1 rounded hover:bg-indigo-100 transition-colors whitespace-nowrap"
                          >
                            {isOpen ? "Hide Explanation" : "💡 Explain the Question"}
                          </button>
                        </div>

                        {isOpen && (
                          <div className="mt-3 p-4 bg-indigo-50 border border-indigo-200 rounded-md text-xs text-indigo-900 space-y-2">
                            <p className="font-bold text-indigo-950">💡 {item.explanation}</p>
                            <p className="leading-relaxed">{item.example}</p>
                          </div>
                        )}

                        <div className="grid grid-cols-5 gap-2 mt-3">
                          {likertLabels.map(({ num, label }) => (
                            <button
                              key={num}
                              type="button"
                              onClick={() => setPart1Responses({ ...part1Responses, [item.id]: num })}
                              className={`p-2 text-xs border rounded-md text-center transition-colors ${
                                part1Responses[item.id] === num ? 'bg-blue-600 text-white font-bold' : 'bg-gray-50 hover:bg-gray-100 text-gray-700'
                              }`}
                            >
                              {label}
                            </button>
                          ))}
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* Self Check Part 1 */}
                <div className="mt-6 bg-slate-50 p-4 rounded-md border">
                  <label className="block text-xs font-bold text-gray-700 mb-1">
                    Self-check (not scored): In your own words, would you describe yourself as more of an introvert or an extrovert?
                  </label>
                  <input
                    type="text"
                    value={part1SelfCheck}
                    onChange={(e) => setPart1SelfCheck(e.target.value)}
                    placeholder="Enter your thoughts..."
                    className="w-full p-2 border rounded-md text-xs outline-none focus:ring-1 focus:ring-blue-500"
                  />
                </div>
              </div>

              {/* PART 2 */}
              <div className="pt-4 border-t">
                <h2 className="text-xl font-bold text-gray-800 border-b pb-3 mb-4">PART 2 - Grit (10 items)</h2>
                <div className="space-y-4">
                  {gritItems.map((item) => {
                    const expKey = `p2_${item.id}`;
                    const isOpen = openExplanations[expKey];
                    return (
                      <div key={item.id} className="pt-2 border-b border-gray-100 pb-3">
                        <div className="flex justify-between items-start gap-2">
                          <p className="text-gray-800 font-medium text-sm flex-1">{item.id}. {item.text}</p>
                          <button
                            type="button"
                            onClick={() => toggleExplanation(expKey)}
                            className="text-xs bg-indigo-50 text-indigo-700 font-semibold px-2 py-1 rounded hover:bg-indigo-100 transition-colors whitespace-nowrap"
                          >
                            {isOpen ? "Hide Explanation" : "💡 Explain the Question"}
                          </button>
                        </div>

                        {isOpen && (
                          <div className="mt-3 p-4 bg-indigo-50 border border-indigo-200 rounded-md text-xs text-indigo-900 space-y-2">
                            <p className="font-bold text-indigo-950">💡 {item.explanation}</p>
                            <p className="leading-relaxed">{item.example}</p>
                          </div>
                        )}

                        <div className="grid grid-cols-5 gap-2 mt-3">
                          {likertLabels.map(({ num, label }) => (
                            <button
                              key={num}
                              type="button"
                              onClick={() => setPart2Responses({ ...part2Responses, [item.id]: num })}
                              className={`p-2 text-xs border rounded-md text-center transition-colors ${
                                part2Responses[item.id] === num ? 'bg-blue-600 text-white font-bold' : 'bg-gray-50 hover:bg-gray-100 text-gray-700'
                              }`}
                            >
                              {label}
                            </button>
                          ))}
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* Self Check Part 2 */}
                <div className="mt-6 bg-slate-50 p-4 rounded-md border">
                  <label className="block text-xs font-bold text-gray-700 mb-1">
                    Self-check (not scored): On a scale of "I give up easily" to "I never give up," where would you honestly place yourself, and why?
                  </label>
                  <input
                    type="text"
                    value={part2SelfCheck}
                    onChange={(e) => setPart2SelfCheck(e.target.value)}
                    placeholder="Enter your thoughts..."
                    className="w-full p-2 border rounded-md text-xs outline-none focus:ring-1 focus:ring-blue-500"
                  />
                </div>
              </div>

              {/* PART 3: LEARNING APPROACH */}
              <div className="pt-4 border-t">
                <h2 className="text-xl font-bold text-gray-800 pb-1">PART 3 - Learning Approach (10 scenarios)</h2>
                <p className="text-xs text-blue-600 mb-4">💡 Select ALL options that fit how you would actually behave in each scenario.</p>
                
                {learningApproachItems.map((item) => {
                  const selectedCodes = part3Responses[item.id] || [];
                  const expKey = `p3_${item.id}`;
                  const isOpen = openExplanations[expKey];

                  return (
                    <div key={item.id} className="mb-6 bg-gray-50 p-4 rounded-md border">
                      <div className="flex justify-between items-start gap-2 mb-3">
                        <p className="text-sm font-bold text-gray-800 flex-1">{item.scenario}</p>
                        <button
                          type="button"
                          onClick={() => toggleExplanation(expKey)}
                          className="text-xs bg-indigo-100 text-indigo-800 font-semibold px-2 py-1 rounded hover:bg-indigo-200 transition-colors whitespace-nowrap"
                        >
                          {isOpen ? "Hide Explanation" : "💡 Explain the Question"}
                        </button>
                      </div>

                      {isOpen && (
                        <div className="mb-4 p-4 bg-indigo-50 border border-indigo-200 rounded-md text-xs text-indigo-900 space-y-2">
                          <p className="font-bold text-indigo-950">💡 {item.explanation}</p>
                          <p className="leading-relaxed">{item.example}</p>
                        </div>
                      )}

                      <div className="space-y-2">
                        {item.options.map((opt) => {
                          const isChecked = selectedCodes.includes(opt.code);
                          return (
                            <label
                              key={opt.code}
                              onClick={() => togglePart3Option(item.id, opt.code)}
                              className={`flex items-start p-2.5 border rounded-md cursor-pointer transition-colors ${
                                isChecked ? 'bg-blue-50 border-blue-400' : 'bg-white hover:bg-gray-100'
                              }`}
                            >
                              <input
                                type="checkbox"
                                checked={isChecked}
                                onChange={() => {}}
                                className="mt-0.5 h-4 w-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500"
                              />
                              <span className="ml-3 text-xs text-gray-700 leading-relaxed">
                                <strong>({opt.code})</strong> {opt.label}
                              </span>
                            </label>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}

                {/* Self Check Part 3 */}
                <div className="mt-6 bg-slate-50 p-4 rounded-md border">
                  <label className="block text-xs font-bold text-gray-700 mb-1">
                    Self-check (not scored): If you had to describe how you learn best in one sentence, what would you say?
                  </label>
                  <input
                    type="text"
                    value={part3SelfCheck}
                    onChange={(e) => setPart3SelfCheck(e.target.value)}
                    placeholder="Enter your thoughts..."
                    className="w-full p-2 border rounded-md text-xs outline-none focus:ring-1 focus:ring-blue-500"
                  />
                </div>
              </div>

              {/* PART 4: INTEREST PROFILE */}
              <div className="pt-4 border-t">
                <h2 className="text-xl font-bold text-gray-800 border-b pb-3 mb-4">PART 4 - Interest Profile (36 items)</h2>
                <div className="space-y-4">
                  {interestProfileItems.map((item) => {
                    const expKey = `p4_${item.id}`;
                    const isOpen = openExplanations[expKey];
                    return (
                      <div key={item.id} className="pt-2 border-b border-gray-100 pb-3">
                        <div className="flex justify-between items-start gap-2">
                          <p className="text-gray-800 font-medium text-sm flex-1">{item.id}. {item.text}</p>
                          <button
                            type="button"
                            onClick={() => toggleExplanation(expKey)}
                            className="text-xs bg-indigo-50 text-indigo-700 font-semibold px-2 py-1 rounded hover:bg-indigo-100 transition-colors whitespace-nowrap"
                          >
                            {isOpen ? "Hide Explanation" : "💡 Explain the Question"}
                          </button>
                        </div>

                        {isOpen && (
                          <div className="mt-3 p-4 bg-indigo-50 border border-indigo-200 rounded-md text-xs text-indigo-900 space-y-2">
                            <p className="font-bold text-indigo-950">💡 {item.explanation}</p>
                            <p className="leading-relaxed">{item.example}</p>
                          </div>
                        )}

                        <div className="grid grid-cols-5 gap-2 mt-3">
                          {part4LikertLabels.map(({ num, label }) => (
                            <button
                              key={num}
                              type="button"
                              onClick={() => setPart4Responses({ ...part4Responses, [item.id]: num })}
                              className={`p-2 text-xs border rounded-md text-center transition-colors ${
                                part4Responses[item.id] === num ? 'bg-blue-600 text-white font-bold' : 'bg-gray-50 hover:bg-gray-100 text-gray-700'
                              }`}
                            >
                              {label}
                            </button>
                          ))}
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* Self Check Part 4 */}
                <div className="mt-6 bg-slate-50 p-4 rounded-md border">
                  <label className="block text-xs font-bold text-gray-700 mb-1">
                    Self-check (not scored): If you didn't have to think about salary or family expectations at all, what kind of work would genuinely excite you?
                  </label>
                  <input
                    type="text"
                    value={part4SelfCheck}
                    onChange={(e) => setPart4SelfCheck(e.target.value)}
                    placeholder="Enter your thoughts..."
                    className="w-full p-2 border rounded-md text-xs outline-none focus:ring-1 focus:ring-blue-500"
                  />
                </div>
              </div>

              <button
                onClick={submitAssessment}
                className="w-full mt-8 bg-green-600 text-white py-4 rounded-md font-bold text-lg hover:bg-green-700 transition-colors shadow-md"
              >
                Submit Complete Assessment
              </button>
            </div>
          </div>
        );
      }

      // --- CHANGE 4: RESULTS SUMMARY VIEW & NEW CTA ---
      if (view === 'summary') {
        const p1Score = calculateWorkStyleScore(part1Responses);
        const p2Score = calculateGritScore(part2Responses);
        const p3Profile = calculateLearningProfile(part3Responses);
        const p4Totals = calculateInterestProfile(part4Responses);

        const p1Skipped = getSkippedItemIds(workStyleItems, part1Responses, false);
        const p2Skipped = getSkippedItemIds(gritItems, part2Responses, false);
        const p3Skipped = getSkippedItemIds(learningApproachItems, part3Responses, true);
        const p4Skipped = getSkippedItemIds(interestProfileItems, part4Responses, false);

        return (
          <div className="max-w-3xl mx-auto my-8 p-6 md:p-8 bg-white rounded-lg shadow-sm border space-y-6 print-shadow-none">
            
            {/* WRAPPER TARGETED FOR PDF GENERATION */}
            <div id="pdf-report-content" className="p-4 bg-white space-y-6">
              <div className="text-center space-y-2 border-b pb-4">
                <div className="text-green-500 text-5xl no-print">✓</div>
                <h1 className="text-xl font-bold text-blue-900 uppercase tracking-wide">PrepWorks Global Student Assessment</h1>
                <h2 className="text-2xl font-bold text-gray-800">Assessment Diagnostic Summary</h2>
                <div className="text-xs text-gray-500 mt-2 flex justify-center gap-6 flex-wrap">
                  <span><strong>Student Name:</strong> {fullName || 'N/A'}</span>
                  <span><strong>Stage:</strong> {stage || 'N/A'}</span>
                  <span><strong>Date:</strong> {new Date().toLocaleDateString()}</span>
                </div>
              </div>

              {/* PART 1 SUMMARY */}
              <div className="bg-slate-50 p-5 rounded-lg border text-left space-y-2" style={{ breakInside: 'avoid', pageBreakInside: 'avoid' }}>
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-gray-800">Part 1: Work Style Overview</h3>
                  <span className="text-xs font-semibold bg-blue-100 text-blue-800 px-2.5 py-1 rounded">Average: {p1Score.avg} / 5</span>
                </div>
                <p className="text-xs text-gray-600">Completed items: {p1Score.count} / 32</p>
                {p1Skipped.length > 0 && (
                  <p className="text-xs text-red-600 font-medium">Skipped: Q{p1Skipped.join(', Q')}</p>
                )}
                {part1SelfCheck && (
                  <p className="text-xs text-gray-700 italic border-l-2 border-blue-400 pl-2 mt-2">
                    "Self Check: {part1SelfCheck}"
                  </p>
                )}
              </div>

              {/* PART 2 SUMMARY */}
              <div className="bg-slate-50 p-5 rounded-lg border text-left space-y-2" style={{ breakInside: 'avoid', pageBreakInside: 'avoid' }}>
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-gray-800">Part 2: Grit Score</h3>
                  <span className="text-xs font-semibold bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded">Overall Score: {p2Score.score} / 5</span>
                </div>
                <p className="text-xs text-gray-600">Completed items: {p2Score.count} / 10</p>
                {p2Skipped.length > 0 && (
                  <p className="text-xs text-red-600 font-medium">Skipped: Q{p2Skipped.join(', Q')}</p>
                )}
                {part2SelfCheck && (
                  <p className="text-xs text-gray-700 italic border-l-2 border-emerald-400 pl-2 mt-2">
                    "Self Check: {part2SelfCheck}"
                  </p>
                )}
              </div>

              {/* PART 3 SUMMARY */}
              <div className="bg-slate-50 p-5 rounded-lg border text-left space-y-4" style={{ breakInside: 'avoid', pageBreakInside: 'avoid' }}>
                <h3 className="font-bold text-gray-800 border-b pb-2">Part 3: Learning Approach Breakdown</h3>
                <p className="text-xs text-gray-600">Completed scenarios: {10 - p3Skipped.length} / 10</p>
                {p3Skipped.length > 0 && (
                  <p className="text-xs text-red-600 font-medium">Skipped: Scenario {p3Skipped.join(', Scenario ')}</p>
                )}
                <div className="space-y-3">
                  {Object.entries(p3Profile.counts).map(([style, count]) => {
                    const percentage = p3Profile.totalSelections > 0 ? Math.round((count / p3Profile.totalSelections) * 100) : 0;
                    return (
                      <div key={style} className="space-y-1">
                        <div className="flex justify-between text-xs font-semibold text-gray-700">
                          <span>{style}</span>
                          <span>{count} selections ({percentage}%)</span>
                        </div>
                        <div className="w-full bg-gray-200 rounded-full h-2.5">
                          <div className="bg-indigo-600 h-2.5 rounded-full" style={{ width: `${percentage}%` }}></div>
                        </div>
                      </div>
                    );
                  })}
                </div>
                {part3SelfCheck && (
                  <p className="text-xs text-gray-700 italic border-l-2 border-indigo-400 pl-2 mt-2">
                    "Self Check: {part3SelfCheck}"
                  </p>
                )}
              </div>

              {/* PART 4 SUMMARY */}
              <div className="bg-slate-50 p-5 rounded-lg border text-left space-y-4" style={{ breakInside: 'avoid', pageBreakInside: 'avoid' }}>
                <h3 className="font-bold text-gray-800 border-b pb-2">Part 4: Interest Profile (Holland Codes)</h3>
                <p className="text-xs text-gray-600">Completed items: {36 - p4Skipped.length} / 36</p>
                {p4Skipped.length > 0 && (
                  <p className="text-xs text-red-600 font-medium">Skipped: Q{p4Skipped.join(', Q')}</p>
                )}
                <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                  {Object.entries(p4Totals).map(([cat, val]) => (
                    <div key={cat} className="p-3 bg-white border rounded text-center">
                      <div className="text-xs text-gray-500 font-medium">{cat}</div>
                      <div className="text-lg font-bold text-gray-800">{val} pts</div>
                    </div>
                  ))}
                </div>
                {part4SelfCheck && (
                  <p className="text-xs text-gray-700 italic border-l-2 border-purple-400 pl-2 mt-2">
                    "Self Check: {part4SelfCheck}"
                  </p>
                )}
              </div>
            </div>

            {/* PDF DOWNLOAD BUTTON */}
            <div className="no-print pt-4 border-t flex justify-center">
              <button
                onClick={handleDownloadPDF}
                className="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-md flex items-center justify-center gap-2 transition-colors shadow-sm text-sm"
              >
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                Download My Results PDF
              </button>
            </div>

            {/* CHANGE 4: NORTH STAR REPORT CTA SECTION */}
            <div className="no-print mt-8 p-6 bg-gradient-to-br from-slate-900 to-blue-950 text-white rounded-xl shadow-lg border border-blue-900 text-center space-y-5">
              <h3 className="text-2xl font-extrabold text-blue-300">Get your full North Star Report</h3>
              <p className="text-sm text-slate-200 max-w-xl mx-auto leading-relaxed">
                Your Clarity Scan shows where you stand. The North Star Report turns it into a personalised SWOT analysis and a step-by-step career plan, written for you by a PrepWorksGlobal career coach. Delivered within 48 hours.
              </p>
              
              <div className="flex flex-col sm:flex-row gap-3 justify-center items-center pt-2">
                <a
                  href={RAZORPAY_NORTH_STAR_LINK}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="w-full sm:w-auto bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold py-3.5 px-6 rounded-lg text-sm transition-all transform hover:scale-105 shadow-md flex items-center justify-center"
                >
                  Get my North Star Report: ₹1,299
                </a>
                <a
                  href={RAZORPAY_BUNDLE_LINK}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="w-full sm:w-auto bg-slate-800 hover:bg-slate-700 text-blue-200 border border-blue-400/30 font-semibold py-3.5 px-6 rounded-lg text-sm transition-colors flex items-center justify-center"
                >
                  Report + 1-hour debrief: ₹3,999
                </a>
              </div>

              <div className="pt-2 space-y-1">
                <div>
                  <a
                    href={`https://wa.me/${WHATSAPP_NUMBER}`}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="text-xs text-blue-300 hover:text-blue-200 underline font-medium"
                  >
                    Have a question first? Chat on WhatsApp
                  </a>
                </div>
                <p className="text-xs text-slate-400 pt-3 border-t border-slate-800">
                  We've also saved your results, so you don't need to send us anything.
                </p>
              </div>
            </div>

          </div>
        );
      }

      return null;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<MainApp />);
  </script>
</body>
</html>
