  <script type="text/babel">
    const { useState, useEffect } = React;

    // =====================================================================
    // REPORT SETTINGS — switch sections of the student report on or off.
    // Revisit these after the pilot, once you know which scales are reliable
    // (Cronbach's alpha of 0.70 or more in the pilot workbook).
    // =====================================================================
    const REPORT_SETTINGS = {
      showWorkStyleCode: false,      // four-letter style code (e.g. IAEP) in Part 1
      workStyleLeanThreshold: 60,    // % needed before a Part 1 lean is named at all
      showPersistenceBand: true,     // "Moderate", "Strong" etc. next to the Part 2 score
      showLearningPattern: true,     // "Bimodal: Visual + Aural" badge in Part 3
      showInterestCode: true,        // three-letter interest code in Part 4
      showResponseFlags: true,       // amber "answers were all the same" warnings
      showResearchSection: true      // anonymised answers + research data line
    };

    // Instrument version — change this whenever any item wording changes, so
    // pilot data from different versions is never mixed in the same analysis.
    const INSTRUMENT_VERSION = "CS3";

    // --- ASSESSMENT DATA STRUCTURES ---

    // Part 2 response options (PrepWorks wording).
    const gritLabels = [

      { num: 2, label: "Rarely true of me" },

    const part4LikertLabels = [

    // PART 1: WORK STYLE (32 items)
    const workStyleItems = [
      { id: 1, text: "I feel more energised after a group discussion than after time spent alone.", explanation: "Do you feel pumped up after brainstorming a school project with your classmates, or do you prefer studying quietly in your room to recharge?", example: "Clarity Crew Example: Dev leaves a group brainstorm buzzing with energy, while Zoya recharges by spending the evening alone in her workshop." },
      { id: 2, text: "I'm more interested in what something could become than in how it currently works.", explanation: "When given a science assignment, do you get excited dreaming up big creative ideas for the future, or do you focus on how things actually work right now?", example: "Clarity Crew Example: Meera loves sketching gadgets that don't exist yet, while Zoya enjoys understanding exactly how today's lab equipment works." },
      { id: 3, text: "When giving feedback, keeping the relationship comfortable matters as much as being accurate.", explanation: "If your friend makes a mistake on a group presentation slide, do you gently point it out to avoid hurting their feelings, or do you tell them straight to get the best marks?", example: "Clarity Crew Example: When Meera's slide has an error, Dev mentions it gently so she isn't embarrassed, while Zoya points it out directly so the team gets the marks." },
      { id: 4, text: "I prefer to keep my options open rather than commit to a plan early.", explanation: "When planning a weekend outing with school friends, do you like keeping plans flexible until the last minute, or deciding exact places and timings days in advance?", example: "Clarity Crew Example: Dev likes to keep the weekend open and decide on the day, while Zoya has the place and timings fixed by Wednesday." },
      { id: 5, text: "In a new class, I usually wait to be approached rather than introduce myself first.", explanation: "On the first day of tuition class, do you sit quietly waiting for someone to talk to you, or do you walk up and introduce yourself to new people?", example: "Clarity Crew Example: On the first day of coaching class, Kiran waits for someone to say hello, while Meera walks around introducing herself to everyone." },
      { id: 6, text: "I trust concrete facts and past experience more than a hunch.", explanation: "When solving a tricky math problem, do you rely strictly on formulas you've practiced before, or do you trust a gut feeling about the answer?", example: "Clarity Crew Example: Paati sticks with the recipe she has made a hundred times, while Kiran follows a hunch about what might taste better." },
      { id: 7, text: "I make decisions primarily on logic, even if it's unpopular.", explanation: "When dividing work for a school assignment, do you assign roles strictly by who is best at each job, even if that is not the popular choice?", example: "Clarity Crew Example: Dev assigns team roles strictly by who is best at each job, even when it isn't the popular choice, while Meera also weighs who would enjoy which role." },
      { id: 8, text: "I like finishing a task well before the deadline.", explanation: "Do you submit project reports days before the due date, or are you pulling an all-nighter right before the submission hour?", example: "Clarity Crew Example: Kiran submits his project three days early, while Meera does her best work in a final push the night before." },
      { id: 9, text: "I do my best thinking out loud, in conversation with others.", explanation: "When trying to solve a tough question, do you need to talk it out with a classmate, or do you sit silently and work through it in your head?", example: "Clarity Crew Example: Zoya cracks a hard problem by talking it through out loud, while Dev works it out silently in his notebook." },
      { id: 10, text: "I often notice patterns or connections that others miss.", explanation: "While analyzing a case study or story in class, do you pick up on small hidden connections between ideas that your friends didn't spot?", example: "Clarity Crew Example: Dev notices that the history and geography chapters are describing the same river, a link nobody else in class picked up on." },
      { id: 11, text: "When a decision is close, how people will feel usually tips it for me.", explanation: "When two choices seem equally good, does thinking about how people will feel make the decision for you?", example: "Clarity Crew Example: Choosing between two equally good venues for the class farewell, Meera picks the one where nobody feels left out, while Kiran picks the one that scores better on cost and distance." },
      { id: 12, text: "Unstructured, open-ended situations energise me rather than stress me.", explanation: "If a teacher says 'create any project you want' with no fixed rules, do you feel excited or do you get stressed out needing clear guidelines?", example: "Clarity Crew Example: Told to 'build anything you like', Meera gets excited, while Dev would first like to see the marking rubric." },
      { id: 13, text: "After a long day of meetings or classes, I'd rather unwind alone than with a group.", explanation: "After a long, tiring day of school and back-to-back tuition, do you want to relax by watching a show alone or by hanging out with friends?", example: "Clarity Crew Example: After a long school day, Meera wants quiet time alone, while Kiran wants to meet friends at the chai stall." },
      { id: 14, text: "When learning something new, I want the step-by-step process before the big picture.", explanation: "When learning a new software tool or lab experiment, do you want clear 1-2-3 steps first, or do you want to understand the end result first?", example: "Clarity Crew Example: Kiran wants clear 1-2-3 steps before trying a new app, while Meera wants to see the finished result first and work backwards." },
      { id: 15, text: "I'd rather be respected for being right than liked for being kind.", explanation: "In a class debate, is it more important to you to state the exact correct facts, or to make sure everyone feels valued and respected?", example: "Clarity Crew Example: In a debate, Kiran cares most about getting every fact exactly right, while Zoya cares most that everyone leaves feeling respected." },
      { id: 16, text: "I make to-do lists and feel uneasy when I fall behind on them.", explanation: "Do you write daily study schedules and feel bothered if you miss a task, or do you prefer studying whatever subject you feel like at the moment?", example: "Clarity Crew Example: Meera ticks off a daily study checklist and feels uneasy if she falls behind, while Kiran studies whichever subject he's in the mood for." },
      { id: 17, text: "I'd rather work through a problem by talking it out with someone than by writing it down first.", explanation: "When stuck on an essay topic, do you prefer calling a friend to chat about ideas, or opening a notebook to write outline notes alone?", example: "Clarity Crew Example: Stuck on an essay topic, Meera phones a friend to chat it through, while Kiran opens a notebook and outlines it alone." },
      { id: 18, text: "I enjoy speculating about future possibilities more than discussing present realities.", explanation: "Do you prefer talking with friends about where technology will be in 10 years, or discussing current exam scores and daily news?", example: "Clarity Crew Example: Dev loves imagining what cities will look like in 2050, while Zoya prefers discussing this week's results and news." },
      { id: 19, text: "Harmony in a group matters more to me than winning an argument.", explanation: "If your project team disagrees on an idea, would you rather let someone else have their way to keep peace, or debate until your idea wins?", example: "Clarity Crew Example: When the team disagrees, Meera lets her idea go to keep the peace, while Dev keeps debating until the strongest argument wins." },
      { id: 20, text: "I tend to start several things and figure out priority as I go.", explanation: "When studying for exams, do you open three subjects at once and jump between them, or do you finish one subject completely before starting the next?", example: "Clarity Crew Example: Zoya has three subjects open at once and jumps between them, while Kiran finishes one before starting the next." },
      { id: 21, text: "Large networking events feel draining to me more than exciting.", explanation: "Does attending a big school cultural event with hundreds of students exhaust you, or does it make you feel lively and energetic?", example: "Clarity Crew Example: The crowd at the school annual day leaves Dev drained, while the same crowd gives Zoya a burst of energy." },
      { id: 22, text: "I prefer instructions that are precise and literal over ones that are open to interpretation.", explanation: "Do you prefer teachers who give exact word-for-word guidelines for assignments, or teachers who let you interpret the project your own way?", example: "Clarity Crew Example: Zoya prefers a teacher who spells out exactly what is expected, while Meera prefers one who lets her interpret the task her own way." },
      { id: 23, text: "Fairness, to me, means applying the same rule to everyone regardless of circumstance.", explanation: "If a classmate turns in homework late, should everyone get the exact same penalty, or should the teacher make exceptions based on personal reasons?", example: "Clarity Crew Example: Ms. Thomas gives every late submission the same penalty, while another teacher considers each student's reasons." },
      { id: 24, text: "I prefer a detailed itinerary over a loose plan when travelling.", explanation: "When going on a school picnic or trip, do you like having a written schedule for every hour, or just deciding what to do after arriving?", example: "Clarity Crew Example: Dev writes an hour-by-hour plan for the school trip, while Meera decides what to see after arriving." },
      { id: 25, text: "I speak up in group settings without needing to rehearse what I'll say first.", explanation: "When the teacher asks a question in class, do you raise your hand and answer instantly, or do you mentally practice your sentence first?", example: "Clarity Crew Example: Dev answers the teacher's question on the spot, while Zoya rehearses her sentence in her head before raising her hand." },
      { id: 26, text: "I get bored explaining or working through routine, repetitive details.", explanation: "Do repetitive tasks, like filling in lab-record sheets, feel tiring and boring to you, or steady and calming?", example: "Clarity Crew Example: Meera gets restless filling in repetitive lab-record sheets, while Kiran finds steady routine work calming." },
      { id: 27, text: "I factor in how a decision will make people feel, not just whether it's correct.", explanation: "When picking a group leader, do you choose someone who makes everyone feel included, or purely whoever has the highest marks?", example: "Clarity Crew Example: Choosing a group leader, Zoya thinks about who will make everyone feel included, while Dev looks first at who has the best track record." },
      { id: 28, text: "Last-minute changes don't bother me much I adapt easily.", explanation: "If your exam timetable or class location suddenly changes an hour before, can you smoothly adapt without feeling flustered?", example: "Clarity Crew Example: When the exam hall changes an hour before, Kiran shrugs and adapts, while Meera needs a few minutes to re-plan." },
      { id: 29, text: "I prefer communicating by writing (email, chat) over speaking in real time.", explanation: "When discussing project work with classmates, do you prefer typing in a WhatsApp group, or calling them on the phone?", example: "Clarity Crew Example: Kiran prefers sorting out project work in the group chat, while Meera would rather just call." },
      { id: 30, text: "I'd rather refine something proven than invent something new.", explanation: "In a science project, would you rather take an existing popular experiment and make it better, or try inventing something totally unproven?", example: "Clarity Crew Example: Kiran likes improving a classic experiment that is known to work, while Ms. Thomas likes trying something nobody has tested." },
      { id: 31, text: "I find it easy to separate a critique of someone's work from a critique of them personally.", explanation: "If a teacher points out mistakes on your test paper, do you view it as helpful guidance on your work without feeling personally attacked?", example: "Clarity Crew Example: When Ms. Thomas marks errors on their papers, Zoya treats the red ink as feedback on the work, while Kiran finds it harder not to take it personally." },
      { id: 32, text: "Closing out decisions quickly, even imperfectly, feels better to me than leaving them open.", explanation: "When picking a topic for a seminar, do you like making a quick decision so you can start, or do you take days weighing options?", example: "Clarity Crew Example: Zoya picks a seminar topic in five minutes so she can get started, while Dev takes a few days to weigh every option." }
    ];

    // PART 2: PERSISTENCE & FOCUS (10 items, original wording)
    // Odd items = Steady Effort (scored as answered). Even items = Staying on Course (reverse-scored).
    const gritItems = [
      { id: 1, text: "When a chapter is hard to understand, I keep returning to it until it makes sense.", explanation: "Do you stick with difficult material until you understand it, or move on when it gets confusing?", example: "Clarity Crew Example: Kiran rereads the electricity chapter four evenings in a row until the circuits finally click." },
      { id: 2, text: "I've joined clubs, classes or courses full of enthusiasm and then stopped going within a few weeks.", explanation: "Have you often started new activities with excitement and dropped them soon after?", example: "Clarity Crew Example: Dev joined the guitar, chess and coding clubs this year and stopped attending each one after about a month." },
      { id: 3, text: "I put steady effort into my studies even when nobody is checking on me.", explanation: "Do you keep working consistently on your own, without reminders or a deadline pushing you?", example: "Clarity Crew Example: Meera revises a little every evening, even in the holidays when no test is coming up." },
      { id: 4, text: "My answer to 'What do you want to do after school?' keeps changing.", explanation: "Does your idea of your future course or career change often?", example: "Clarity Crew Example: Last year Kiran wanted to be a pilot, this term a chef, and now a game designer." },
      { id: 5, text: "A poor mark makes me work harder on that subject, not less.", explanation: "When you do badly at something, does it push you to try harder?", example: "Clarity Crew Example: After a low score in a maths unit test, Zoya asks Ms. Thomas for extra practice problems." },
      { id: 6, text: "I often have unfinished projects or hobbies lying around because something more exciting came along.", explanation: "Do new interests often pull you away before you finish what you started?", example: "Clarity Crew Example: Zoya's desk has a half-built robot, a half-painted model and a drone kit she opened yesterday." },
      { id: 7, text: "If my first attempt at something fails, I try a different method instead of stopping.", explanation: "When a plan doesn't work, do you look for another route to the same goal?", example: "Clarity Crew Example: When Kiran's model bridge collapses, he redesigns it with triangles instead of giving up." },
      { id: 8, text: "Once the novelty of something new wears off, I find it hard to stay interested.", explanation: "Do you lose interest in things once they stop feeling new and exciting?", example: "Clarity Crew Example: Dev was hooked on photography for two weeks; now the camera sits in a drawer." },
      { id: 9, text: "When I promise to deliver something, I see it through even if it takes longer than expected.", explanation: "Do you follow through on commitments even when they turn out harder than you thought?", example: "Clarity Crew Example: Meera promised the team the slides by Sunday and finished them, even though they took twice as long as planned." },
      { id: 10, text: "I often set myself a new goal and then switch to a different one a few months later.", explanation: "Do your goals tend to change before you reach them?", example: "Clarity Crew Example: In June Dev was aiming for the science olympiad, by August it was the debate team, and now it's a coding hackathon." }
    ];

    const learningApproachItems = [
      {

        scenario: "1. Learning new software:",

          { code: 'b', label: "Watch a demo video", type: "Visual" },

        options: [
          { code: 'a', label: "Leads discussion and explains verbally", type: "Aural" },
          { code: 'b', label: "Provides detailed notes and readings", type: "Read/Write" },

      },

    const interestProfileItems = [
      // Order is interleaved (R, I, A, S, E, C, R, I, ...) so students can't see each area's theme.
      { id: 1, text: "Repair or troubleshoot a piece of equipment or machinery.", category: "Realistic", explanation: "Do you enjoy fixing broken bicycles, gadgets, or household appliances?", example: "Clarity Crew Example: Zoya fixing the slipped chain on her bicycle herself." },
      { id: 2, text: "Work out why an experiment or system keeps failing.", category: "Investigative", explanation: "Do you enjoy tracking down the real cause of a problem?", example: "Clarity Crew Example: Zoya testing soil, light and water to find out why the class plants keep wilting." },
      { id: 3, text: "Design something original — a visual, a write-up, a pitch, a product concept.", category: "Artistic", explanation: "Do you like creating fresh art, posters, or creative project concepts?", example: "Clarity Crew Example: Dev designing an eye-catching poster for the school fest." },
      { id: 4, text: "Teach, coach, or mentor someone through a skill or problem.", category: "Social", explanation: "Do you enjoy helping junior students or classmates understand tough lessons?", example: "Clarity Crew Example: Kiran helping a Class 6 student finally understand fractions." },
      { id: 5, text: "Pitch an idea and persuade others to back it.", category: "Enterprising", explanation: "Do you enjoy convincing classmates or teachers to support your ideas?", example: "Clarity Crew Example: Dev convincing the principal to approve a new astronomy club." },
      { id: 6, text: "Organise and maintain accurate records or files.", category: "Conventional", explanation: "Do you like keeping organized files, folder labels, and neat notes?", example: "Clarity Crew Example: Dev keeping the class library's borrowing records neat and up to date." },
      { id: 7, text: "Do hands-on physical work outdoors.", category: "Realistic", explanation: "Do you enjoy active, physical work outside more than sitting at a desk all day?", example: "Clarity Crew Example: Kiran helping Paati plant the terrace garden on a Sunday morning." },
      { id: 8, text: "Analyse data to find a pattern or explanation.", category: "Investigative", explanation: "Do you enjoy looking at data tables or marks trends to find patterns?", example: "Clarity Crew Example: Meera studying the class's test scores to find which topics most students got wrong." },
      { id: 9, text: "Design the look of a poster, website or room.", category: "Artistic", explanation: "Do you enjoy deciding how something should look?", example: "Clarity Crew Example: Zoya designing the look of the class wall display." },

    ];

    const TOTAL_QUESTIONS = 88; // 32 + 10 + 10 + 36

    // --- HELPER FOR SAFE LOCALSTORAGE ---
    const safeStorage = {
      getItem: (key) => {
        try { return localStorage.getItem(key); } catch (e) { return null; }
      },
      setItem: (key, val) => {
        try { localStorage.setItem(key, val); } catch (e) {}
      },
      removeItem: (key) => {
        try { localStorage.removeItem(key); } catch (e) {}
      }
    };

    // --- POST TO GOOGLE SHEET HELPER ---
    const sendToGoogleSheet = (payload) => {
      if (!SHEET_URL) return;
      try {
        fetch(SHEET_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        }).catch(() => {});
      } catch (e) {}
    };

    // --- MAIN APP COMPONENT ---
    function MainApp() {
      const [view, setView] = useState('signup'); // 'resumePrompt', 'signup', 'intro', 'assessment', 'summary'

      // Sign-up Form State
      const [fullName, setFullName] = useState('');
      const [email, setEmail] = useState('');
      const [countryCode, setCountryCode] = useState('+91');
      const [whatsappNumber, setWhatsappNumber] = useState('');
      const [stage, setStage] = useState('');
      const [consent, setConsent] = useState(false);
      const [source, setSource] = useState('direct');
      const [formError, setFormError] = useState('');

      // Saved State Prompt
      const [savedState, setSavedState] = useState(null);

      // Explanation toggle state
      const [openExplanations, setOpenExplanations] = useState({});

      const toggleExplanation = (key) => {
        setOpenExplanations(prev => ({ ...prev, [key]: !prev[key] }));
      };

      // Response States
      const [part1Responses, setPart1Responses] = useState({});
      const [part2Responses, setPart2Responses] = useState({});
      const [part3Responses, setPart3Responses] = useState({});
      const [part4Responses, setPart4Responses] = useState({});

      // Self-check text responses
      const [part1SelfCheck, setPart1SelfCheck] = useState('');
      const [part2SelfCheck, setPart2SelfCheck] = useState('');
      const [part3SelfCheck, setPart3SelfCheck] = useState('');
      const [part4SelfCheck, setPart4SelfCheck] = useState('');

      const [researchCopyLabel, setResearchCopyLabel] = useState('Copy research data');
      // Random ID so a research record can be matched without any name.
      const [responseId] = useState(() => 'R' + Math.random().toString(36).substring(2, 9).toUpperCase());

      // Initialize parameters, URL prefilling & check saved progress
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const nameParam = params.get('name');
        const emailParam = params.get('email');
        const srcParam = params.get('src');

        if (nameParam) setFullName(decodeURIComponent(nameParam));
        if (emailParam) setEmail(decodeURIComponent(emailParam));
        if (srcParam) setSource(decodeURIComponent(srcParam));

        // Check LocalStorage progress
        const rawSaved = safeStorage.getItem('prepworks_clarity_scan_saved');
        if (rawSaved) {
          try {
            const parsed = JSON.parse(rawSaved);
            if (parsed && (parsed.view === 'assessment' || parsed.view === 'summary')) {
              setSavedState(parsed);
              setView('resumePrompt');
            }
          } catch (e) {}
        }
      }, []);

      // Auto-save progress on changes
      useEffect(() => {
        if (view === 'assessment') {
          const stateToSave = {
            view: 'assessment',
            userInfo: { fullName, email, countryCode, whatsappNumber, stage, consent, source },
            part1Responses,
            part2Responses,
            part3Responses,
            part4Responses,
            part1SelfCheck,
            part2SelfCheck,
            part3SelfCheck,
            part4SelfCheck
          };
          safeStorage.setItem('prepworks_clarity_scan_saved', JSON.stringify(stateToSave));
        }
      }, [
        view, fullName, email, countryCode, whatsappNumber, stage, consent, source,
        part1Responses, part2Responses, part3Responses, part4Responses,
        part1SelfCheck, part2SelfCheck, part3SelfCheck, part4SelfCheck
      ]);

      const handleResume = () => {
        if (!savedState) return;
        const u = savedState.userInfo || {};
        setFullName(u.fullName || '');
        setEmail(u.email || '');
        setCountryCode(u.countryCode || '+91');
        setWhatsappNumber(u.whatsappNumber || '');
        setStage(u.stage || '');
        setConsent(u.consent || false);
        setSource(u.source || 'direct');

        setPart1Responses(savedState.part1Responses || {});
        setPart2Responses(savedState.part2Responses || {});
        setPart3Responses(savedState.part3Responses || {});
        setPart4Responses(savedState.part4Responses || {});

        setPart1SelfCheck(savedState.part1SelfCheck || '');
        setPart2SelfCheck(savedState.part2SelfCheck || '');
        setPart3SelfCheck(savedState.part3SelfCheck || '');
        setPart4SelfCheck(savedState.part4SelfCheck || '');

        setView(savedState.view || 'assessment');
      };

      const handleStartFresh = () => {
        safeStorage.removeItem('prepworks_clarity_scan_saved');
        setSavedState(null);
        setView('signup');
      };

      const validateSignup = (e) => {
        e.preventDefault();
        setFormError('');

        if (!fullName.trim()) return setFormError('Please enter your full name.');
        if (!email.trim()) return setFormError('Please enter your email address.');
        
        // Basic Email Format Validation
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email.trim())) {
          return setFormError('Please enter a valid email address.');
        }

        if (!whatsappNumber.trim()) return setFormError('Please enter your WhatsApp number.');
        if (!stage) return setFormError('Please select your current stage.');
        if (!consent) return setFormError('You must agree to the storage and contact terms to proceed.');

        const fullWhatsapp = `${countryCode}${whatsappNumber.trim()}`;

        // Fire POST event: "started"
        sendToGoogleSheet({
          event: "started",
          name: fullName.trim(),
          email: email.trim(),
          whatsapp: fullWhatsapp,
          stage: stage,
          source: source,
          consent: consent
        });

        setView('intro');
      };

      const togglePart3Option = (scenarioId, code) => {
        setPart3Responses((prev) => {
          const current = prev[scenarioId] || [];
          const updated = current.includes(code)
            ? current.filter((c) => c !== code)
            : [...current, code];
          return { ...prev, [scenarioId]: updated };
        });
      };

      // --- SCORING CALCULATORS ---

      // PART 1 — four bipolar preference dimensions (type-indicator logic).
      // Each dimension has 8 items: 4 keyed to pole A, 4 keyed to pole B.
      // Items keyed to pole B are reverse-scored (6 - answer) so that every
      // answer is expressed as "agreement with pole A".
      const WORK_STYLE_DIMENSIONS = [
        { key: 'energy', name: 'Energy', a: { label: 'Outward', letter: 'O' }, b: { label: 'Inward', letter: 'I' },
          aItems: [1, 9, 17, 25], bItems: [5, 13, 21, 29],
          aDesc: 'recharges through people, conversation and activity',
          bDesc: 'recharges through solitude, reflection and quiet focus' },
        { key: 'information', name: 'Information', a: { label: 'Abstract', letter: 'A' }, b: { label: 'Concrete', letter: 'C' },
          aItems: [2, 10, 18, 26], bItems: [6, 14, 22, 30],
          aDesc: 'drawn to patterns, possibilities and the big picture',
          bDesc: 'trusts facts, experience and step-by-step detail' },
        { key: 'decisions', name: 'Decisions', a: { label: 'Empathy', letter: 'E' }, b: { label: 'Logic', letter: 'L' },
          aItems: [3, 11, 19, 27], bItems: [7, 15, 23, 31],
          aDesc: 'weighs how choices affect people and relationships',
          bDesc: 'weighs objective criteria and consistency first' },
        { key: 'structure', name: 'Structure', a: { label: 'Planned', letter: 'P' }, b: { label: 'Flexible', letter: 'F' },
          aItems: [8, 16, 24, 32], bItems: [4, 12, 20, 28],
          aDesc: 'prefers plans, deadlines and closure',
          bDesc: 'prefers open options, adapting and improvising' }
      ];

      // Bands are deliberately modest: 8 items per dimension can show a lean,
      // not a fixed trait. Below the threshold no lean is named.
      const clarityBand = (strength) => {
        if (strength < REPORT_SETTINGS.workStyleLeanThreshold) return 'No clear lean';
        if (strength < 70) return 'Slight lean';
        if (strength < 85) return 'Moderate lean';
        return 'Clear lean';
      };

      const calculateWorkStyle = (responses) => {
        const dims = WORK_STYLE_DIMENSIONS.map((d) => {
          const vals = [];
          d.aItems.forEach((id) => { if (responses[id] !== undefined) vals.push(responses[id]); });
          d.bItems.forEach((id) => { if (responses[id] !== undefined) vals.push(6 - responses[id]); });
          if (vals.length < 4) return { ...d, insufficient: true, answered: vals.length };
          const mean = vals.reduce((x, y) => x + y, 0) / vals.length;   // 1–5, 3 = midpoint
          const pctA = Math.round(((mean - 1) / 4) * 100);              // 0–100 toward pole A
          const pctB = 100 - pctA;
          let lean, strength;
          if (pctA === 50) { lean = null; strength = 50; }
          else if (pctA > 50) { lean = d.a; strength = pctA; }
          else { lean = d.b; strength = pctB; }
          const named = lean && strength >= REPORT_SETTINGS.workStyleLeanThreshold;
          return { ...d, answered: vals.length, pctA, pctB, lean, named, strength, band: clarityBand(strength) };
        });
        const code = dims.map((d) => (d.insufficient || !d.named ? 'X' : d.lean.letter)).join('');
        return { dims, code };
      };

      // PART 2 — Persistence & Focus: mean of all items (1–5). "Staying on course"
      // items describe drifting away, so they are reverse-scored.
      const GRIT_EFFORT_ITEMS = [1, 3, 5, 7, 9];      // Steady Effort
      const GRIT_INTEREST_ITEMS = [2, 4, 6, 8, 10];   // Staying on Course (reverse-scored)

      // Provisional bands — replace with percentiles from your own pilot data.
      const gritBand = (score) => {
        if (score < 2.5) return 'Developing';
        if (score < 3.5) return 'Moderate';
        if (score < 4.2) return 'Strong';
        return 'Very strong';
      };

      const calculateGritScore = (responses) => {
        const effort = GRIT_EFFORT_ITEMS.filter((i) => responses[i] !== undefined).map((i) => responses[i]);
        const interest = GRIT_INTEREST_ITEMS.filter((i) => responses[i] !== undefined).map((i) => 6 - responses[i]);
        const mean = (arr) => (arr.length ? arr.reduce((x, y) => x + y, 0) / arr.length : null);
        const all = [...effort, ...interest];
        const overall = mean(all);
        return {
          count: all.length,
          insufficient: all.length < 8,
          score: overall !== null ? overall.toFixed(2) : 'N/A',
          band: overall !== null ? gritBand(overall) : 'N/A',
          effort: mean(effort) !== null ? mean(effort).toFixed(2) : 'N/A',
          interest: mean(interest) !== null ? mean(interest).toFixed(2) : 'N/A'
        };
      };

      // PART 3 — Learning preferences: count every option ticked per mode,
      // then apply the "stepping distance" rule to decide which modes count
      // as preferences (single, bi-, tri- or full multimodal).
      const calculateLearningProfile = (responses) => {
        const counts = { Visual: 0, Aural: 0, 'Read/Write': 0, Kinesthetic: 0 };
        let totalSelections = 0;
        let answered = 0;
        learningApproachItems.forEach((item) => {
          const selectedCodes = responses[item.id] || [];
          if (selectedCodes.length) answered++;
          selectedCodes.forEach((code) => {
            const match = item.options.find((opt) => opt.code === code);
            if (match) { counts[match.type]++; totalSelections++; }
          });
        });

        // Stepping distance grows with how many options the person ticks per question.
        const perItem = answered ? totalSelections / answered : 0;
        const step = perItem <= 1.5 ? 1 : perItem <= 2.5 ? 2 : 3;

        const ranked = Object.entries(counts).sort((x, y) => y[1] - x[1]);
        const preferred = [];
        if (totalSelections > 0) {
          preferred.push(ranked[0][0]);
          for (let i = 1; i < ranked.length; i++) {
            if (ranked[i][1] > 0 && ranked[i - 1][1] - ranked[i][1] < step) preferred.push(ranked[i][0]);
            else break;
          }
        }
        const labels = { 1: 'Single preference', 2: 'Bimodal', 3: 'Trimodal', 4: 'Multimodal (all four)' };
        return {
          counts, totalSelections, answered, step, preferred,
          insufficient: answered < 6,
          pattern: preferred.length ? labels[preferred.length] : 'N/A'
        };
      };

      // PART 4 — Interest profile: average liking per area (so skipped items
      // don't drag an area down), ranked to give a three-letter interest code.
      const RIASEC_LETTERS = { Realistic: 'R', Investigative: 'I', Artistic: 'A', Social: 'S', Enterprising: 'E', Conventional: 'C' };

      const calculateInterestProfile = (responses) => {
        const areas = Object.keys(RIASEC_LETTERS).map((cat) => {
          const vals = interestProfileItems.filter((it) => it.category === cat && responses[it.id] !== undefined).map((it) => responses[it.id]);
          const total = vals.reduce((x, y) => x + y, 0);
          const mean = vals.length ? total / vals.length : null;
          return { cat, letter: RIASEC_LETTERS[cat], answered: vals.length, total, mean, insufficient: vals.length < 3 };
        });
        const scored = areas.filter((a) => !a.insufficient).sort((x, y) => y.mean - x.mean);
        const top = scored.slice(0, 3);
        let code = top.map((a) => a.letter).join('');
        // Mark ties at the cut-off so the counsellor knows the order is interchangeable.
        const tieNote = [];
        for (let i = 0; i < scored.length - 1; i++) {
          if (i < 3 && Math.abs(scored[i].mean - scored[i + 1].mean) < 0.01) tieNote.push(`${scored[i].letter}=${scored[i + 1].letter}`);
        }
        const spread = scored.length ? scored[0].mean - scored[scored.length - 1].mean : 0;
        return { areas, code, tieNote, flat: scored.length >= 3 && spread < 1.0, spread };
      };

      // Response-quality check: flags "straight-lining" (same answer to almost everything).
      const straightLineFlag = (responses, threshold) => {
        const vals = Object.values(responses);
        if (vals.length < 5) return null;
        const freq = {};
        vals.forEach((v) => { freq[v] = (freq[v] || 0) + 1; });
        const [val, n] = Object.entries(freq).sort((x, y) => y[1] - x[1])[0];
        return n / vals.length >= threshold ? { val, n, of: vals.length } : null;
      };

      const formatDate = (d) => d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });

      // Returns the item IDs (question numbers) that were left unanswered,
      // so counsellors can see exactly what a student skipped, not just a count.
      const getSkippedItemIds = (items, responses, isMultiSelect) => {
        const skipped = [];
        items.forEach((item) => {
          const val = responses[item.id];
          const isEmpty = isMultiSelect ? (!val || val.length === 0) : (val === undefined);
          if (isEmpty) skipped.push(item.id);
        });
        return skipped;
      };

      // One comma-separated line per student, no name. Column order:
      // version, response_id, month, P1_1..P1_32, P2_1..P2_10, P3_1..P3_10, P4_1..P4_36
      // Part 3 cells hold the letters ticked (e.g. "ac"); skipped = empty cell.
      const buildResearchLine = () => {
        const d = new Date();
        const month = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        const cells = [INSTRUMENT_VERSION, responseId, month];
        workStyleItems.forEach((it) => cells.push(part1Responses[it.id] ?? ''));
        gritItems.forEach((it) => cells.push(part2Responses[it.id] ?? ''));
        learningApproachItems.forEach((it) => cells.push((part3Responses[it.id] || []).slice().sort().join('')));
        interestProfileItems.forEach((it) => cells.push(part4Responses[it.id] ?? ''));
        return cells.join(',');
      };

      const handleCopyResearch = () => {
        navigator.clipboard.writeText(buildResearchLine()).then(() => {
          setResearchCopyLabel('Copied!');
          setTimeout(() => setResearchCopyLabel('Copy research data'), 2000);
        }).catch(() => setResearchCopyLabel('Copy failed — select the line manually'));
      };

      const countAnsweredQuestions = () => {
        let count = 0;
        workStyleItems.forEach(item => { if (part1Responses[item.id] !== undefined) count++; });
        gritItems.forEach(item => { if (part2Responses[item.id] !== undefined) count++; });
        learningApproachItems.forEach(item => { if (part3Responses[item.id] && part3Responses[item.id].length > 0) count++; });
        interestProfileItems.forEach(item => { if (part4Responses[item.id] !== undefined) count++; });
        return count;
      };

      const submitAssessment = () => {
        const gaps = [
          ['Part 1', getSkippedItemIds(workStyleItems, part1Responses, false)],
          ['Part 2', getSkippedItemIds(gritItems, part2Responses, false)],
          ['Part 3', getSkippedItemIds(learningApproachItems, part3Responses, true)],
          ['Part 4', getSkippedItemIds(interestProfileItems, part4Responses, false)]
        ].filter(([, ids]) => ids.length > 0);
        if (gaps.length > 0) {
          const msg = gaps.map(([part, ids]) => `${part}: Q${ids.join(', Q')}`).join('\n');
          const ok = window.confirm(`You have unanswered questions:\n\n${msg}\n\nSkipped questions make your results less accurate. Press Cancel to go back and answer them, or OK to submit anyway.`);
          if (!ok) return;
        }
        const p1 = calculateWorkStyle(part1Responses);
        const p2 = calculateGritScore(part2Responses);
        const p3 = calculateLearningProfile(part3Responses);
        const p4 = calculateInterestProfile(part4Responses);

        // Fire POST event: "completed"
        sendToGoogleSheet({
          event: "completed",
          name: fullName.trim(),
          email: email.trim(),
          whatsapp: `${countryCode}${whatsappNumber.trim()}`,
          stage: stage,
          source: source,
          consent: consent,
          scores: {
            instrument: INSTRUMENT_VERSION,
            responseId: responseId,
            workStyle: {
              code: p1.code,
              dimensions: p1.dims.map((d) => d.insufficient
                ? { name: d.name, insufficient: true }
                : { name: d.name, lean: d.lean ? d.lean.label : 'Balanced', strength: d.strength, pctA: d.pctA, poleA: d.a.label, poleB: d.b.label })
            },
            persistence: { score: p2.score, band: p2.band, steadyEffort: p2.effort, stayingOnCourse: p2.interest },
            learning: { pattern: p3.pattern, preferred: p3.preferred, counts: p3.counts },
            interests: {
              code: p4.code,
              areas: p4.areas.map((a) => ({ area: a.cat, mean: a.mean !== null ? Number(a.mean.toFixed(2)) : null, total: a.total }))
            }

          html2canvas: { scale: 2, useCORS: true, scrollX: 0, scrollY: 0, windowWidth: document.documentElement.scrollWidth },

                  ))}
                </div>
                <p className="text-[11px] text-gray-500">These bars show how you currently tend to work, not fixed traits and not abilities. Everyone uses both sides of each pair; a lean simply shows which side feels more natural right now, and it can shift as you gain experience.{REPORT_SETTINGS.showWorkStyleCode ? ' Code key: O/I = Outward/Inward · A/C = Abstract/Concrete · E/L = Empathy/Logic · P/F = Planned/Flexible · X = no clear lean.' : ''}</p>
                <SelfCheck text={part1SelfCheck} color="border-blue-400" />
              </div>

              {/* PART 2 SUMMARY */}
              <div className="bg-slate-50 p-5 rounded-lg border text-left space-y-3" style={cardStyle}>
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-gray-800">Part 2: Persistence &amp; Focus</h3>
                  <span className="text-xs font-semibold bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded">Score: {p2Score.score} / 5{REPORT_SETTINGS.showPersistenceBand ? ` · ${p2Score.band}` : ''}</span>
                </div>
                <p className="text-xs text-gray-600">Completed items: {p2Score.count} / 10{p2Score.insufficient ? ' — too few answers for a reliable score' : ''}</p>
                {p2Skipped.length > 0 && (
                  <p className="text-xs text-red-600 font-medium">Skipped: Q{p2Skipped.join(', Q')}</p>
                )}
                <Flag f={p2Flag} part="Part 2" />
                <div className="bg-white border rounded divide-y">
                  <div className="flex justify-between px-3 py-2 text-sm">
                    <span className="text-gray-700">Steady effort <span className="text-xs text-gray-400">(sticking with hard work)</span></span>
                    <span className="font-bold text-gray-800">{p2Score.effort} / 5</span>
                  </div>
                  <div className="flex justify-between px-3 py-2 text-sm">
                    <span className="text-gray-700">Staying on course <span className="text-xs text-gray-400">(keeping the same goals over time)</span></span>
                    <span className="font-bold text-gray-800">{p2Score.interest} / 5</span>
                  </div>
                </div>
                <p className="text-[11px] text-gray-500">Persistence and focus are habits that grow with practice; this score describes how you approach things today.</p>
                <SelfCheck text={part2SelfCheck} color="border-emerald-400" />
              </div>

              {/* PART 3 SUMMARY */}
              <div className="bg-slate-50 p-5 rounded-lg border text-left space-y-4" style={cardStyle}>
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-gray-800">Part 3: Learning Preferences</h3>
                  {REPORT_SETTINGS.showLearningPattern && <span className="text-xs font-semibold bg-indigo-100 text-indigo-800 px-2.5 py-1 rounded">{p3Profile.pattern}{p3Profile.preferred.length ? `: ${p3Profile.preferred.join(' + ')}` : ''}</span>}
                </div>
                <p className="text-xs text-gray-600">Completed scenarios: {10 - p3Skipped.length} / 10{p3Profile.insufficient ? ' — too few answers for a reliable profile' : ''}</p>
                {p3Skipped.length > 0 && (
                  <p className="text-xs text-red-600 font-medium">Skipped: Scenario {p3Skipped.join(', Scenario ')}</p>
                )}
                <div className="space-y-3">
                  {Object.entries(p3Profile.counts).map(([style, count]) => {
                    const percentage = p3Profile.totalSelections > 0 ? Math.round((count / p3Profile.totalSelections) * 100) : 0;
                    const isPref = p3Profile.preferred.includes(style);
                    return (
                      <div key={style} className="space-y-1">
                        <div className="flex justify-between text-xs font-semibold text-gray-700">
                          <span>{style}{isPref ? ' ★' : ''}</span>
                          <span>{count} {count === 1 ? 'selection' : 'selections'} ({percentage}%)</span>
                        </div>
                        <div className="w-full bg-gray-200 rounded-full h-2.5">
                          <div className={`${isPref ? 'bg-indigo-600' : 'bg-indigo-300'} h-2.5 rounded-full`} style={{ width: `${percentage}%` }}></div>
                        </div>
                      </div>
                    );
                  })}
                </div>
                <p className="text-[11px] text-gray-500">★ = counts as a preference. These describe how you like to take in information. Most people learn best when material is presented in several ways, so use your preferences as study strategies, not as limits.</p>
                <SelfCheck text={part3SelfCheck} color="border-indigo-400" />
              </div>

              {/* PART 4 SUMMARY */}
              <div className="bg-slate-50 p-5 rounded-lg border text-left space-y-3" style={cardStyle}>
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-gray-800">Part 4: Interest Profile (RIASEC)</h3>
                  {REPORT_SETTINGS.showInterestCode && <span className="text-xs font-semibold bg-purple-100 text-purple-800 px-2.5 py-1 rounded">Interest code: {p4.code || 'N/A'}</span>}
                </div>
                <p className="text-xs text-gray-600">Completed items: {36 - p4Skipped.length} / 36</p>
                {p4Skipped.length > 0 && (
                  <p className="text-xs text-red-600 font-medium">Skipped: Q{p4Skipped.join(', Q')}</p>
                )}
                <Flag f={p4Flag} part="Part 4" />
                <div className="bg-white border rounded divide-y">
                  {p4.areas.map((a) => (
                    <div key={a.cat} className="flex justify-between items-center px-3 py-2 text-sm">
                      <span className="font-medium text-gray-700">{a.cat}</span>
                      <span className="text-gray-800">
                        {a.insufficient ? <span className="text-xs text-gray-400">Not enough answers</span>
                          : <><strong>{a.mean.toFixed(1)} / 5</strong> <span className="text-xs text-gray-400">({a.total} pts from {a.answered} of 6 items)</span></>}
                      </span>
                    </div>
                  ))}
                </div>
                {p4.tieNote.length > 0 && (
                  <p className="text-xs text-gray-600">Tied areas: {p4.tieNote.join(', ')} — the order of these letters is interchangeable.</p>
                )}
                {p4.flat && (
                  <p className="text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded px-2 py-1">Flat profile: your highest and lowest areas are less than 1 point apart, so your interests are not yet strongly differentiated. This is common and is a good starting point for exploration in your session.</p>
                )}
                <p className="text-[11px] text-gray-500">Areas are ranked by average liking per answered item, so skipped questions don't lower a score. Your interest code is your top three areas.</p>
                <SelfCheck text={part4SelfCheck} color="border-purple-400" />
              </div>

              {/* DISCLAIMER */}
              <div className="p-4 rounded-lg border border-gray-300 text-left" style={{ breakInside: 'avoid', pageBreakInside: 'avoid' }}>
                <h3 className="font-bold text-gray-800 text-sm mb-1">Disclaimer</h3>
                <p className="text-xs text-gray-600 leading-relaxed">
                  The Clarity Scan is a self-report reflection tool designed to support career and learning conversations with a PrepWorks Global counsellor. It is not a clinical, diagnostic or selection instrument, and results should not be used on their own to make academic, employment or admission decisions. Scores reflect how you answered on the day and may change over time.
                </p>
              </div>

              {/* ANONYMISED RAW ANSWERS */}
              {REPORT_SETTINGS.showResearchSection && (
              <div className="p-4 rounded-lg border border-dashed border-gray-400 text-left space-y-3" style={{ breakInside: 'avoid', pageBreakInside: 'avoid' }}>
                <h3 className="font-bold text-gray-800 text-sm">For Anonymised Storage for Research Purposes Only</h3>
                <p className="text-[11px] text-gray-500">
                  Format: question.answer (raw answers, before any reverse-scoring). Part 1: 1 = Strongly Disagree … 5 = Strongly Agree. Part 2: 1 = Never true of me … 5 = Always true of me. Part 3: letters chosen (a–d). Part 4: 1 = Strongly Dislike … 5 = Strongly Like. "–" = skipped.
                </p>
                {[
                  { title: 'Part 1: Work Style', items: workStyleItems, resp: part1Responses, multi: false },
                  { title: 'Part 2: Persistence & Focus', items: gritItems, resp: part2Responses, multi: false },
                  { title: 'Part 3: Learning Approach', items: learningApproachItems, resp: part3Responses, multi: true },
                  { title: 'Part 4: Interest Profile', items: interestProfileItems, resp: part4Responses, multi: false }
                ].map(({ title, items, resp, multi }) => (
                  <div key={title}>
                    <div className="text-xs font-semibold text-gray-700">{title}</div>
                    <p className="text-xs text-gray-700 font-mono leading-relaxed break-words">
                      {items.map((item) => {
                        const v = resp[item.id];
                        const ans = multi
                          ? (v && v.length ? [...v].sort().join(',') : '–')
                          : (v !== undefined ? v : '–');
                        return `${item.id}.${ans}`;
                      }).join('  ')}
                    </p>
                  </div>
                ))}
                <div>
                  <div className="text-xs font-semibold text-gray-700">Research data line <span className="font-normal text-gray-500">(response ID {responseId}, instrument {INSTRUMENT_VERSION}; no name included)</span></div>
                  <p className="text-[10px] text-gray-600 font-mono leading-relaxed break-all bg-gray-50 border rounded p-2">{buildResearchLine()}</p>
                  <button
                    type="button"
                    data-html2canvas-ignore="true"
                    onClick={handleCopyResearch}
                    className="no-print mt-2 bg-gray-700 hover:bg-gray-800 text-white text-xs font-semibold px-3 py-1.5 rounded"
                  >
                    {researchCopyLabel}
                  </button>
                </div>
              </div>
              )}
            </div>

            {/* PDF DOWNLOAD BUTTON */}
            <div className="no-print pt-4 border-t flex justify-center">
              <button
                onClick={handleDownloadPDF}
                className="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-md flex items-center justify-center gap-2 transition-colors shadow-sm text-sm"
              >
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                Download My Results PDF
              </button>
            </div>

            {/* NORTH STAR REPORT CTA SECTION */}
            {(() => {
              const firstName = (fullName || '').trim().split(' ')[0] || 'there';
              const waLink = (msg) => `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
              const paymentsLink = waLink(`Hi PrepWorks team, I'm ${fullName || 'a student'} (${email}). I've completed my Clarity Scan and would like to pay for my North Star Report.`);
              return (
                <div className="no-print mt-8 p-6 bg-gradient-to-br from-slate-900 to-blue-950 text-white rounded-xl shadow-lg border border-blue-900 text-center space-y-5">
                  <h3 className="text-2xl font-extrabold text-blue-300">Get your full North Star Report</h3>
                  <p className="text-sm text-slate-200 max-w-xl mx-auto leading-relaxed">
                    Well done, {firstName}. Your Clarity Scan shows where you stand. The North Star Report turns it into a personalised SWOT analysis and a step-by-step career plan, written for you by a PrepWorksGlobal career coach. Delivered within 48 hours.
                  </p>

                  <div className="flex flex-col sm:flex-row gap-3 justify-center items-center pt-2">
                    {RAZORPAY_NORTH_STAR_LINK ? (
                      <>
                        <a
                          href={RAZORPAY_NORTH_STAR_LINK}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="w-full sm:w-auto bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold py-3.5 px-6 rounded-lg text-sm transition-all transform hover:scale-105 shadow-md flex items-center justify-center"
                        >
                          Get my North Star Report: {NORTH_STAR_PRICE}
                        </a>
                        {RAZORPAY_BUNDLE_LINK && (
                          <a
                            href={RAZORPAY_BUNDLE_LINK}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="w-full sm:w-auto bg-slate-800 hover:bg-slate-700 text-blue-200 border border-blue-400/30 font-semibold py-3.5 px-6 rounded-lg text-sm transition-colors flex items-center justify-center"
                          >
                            Report + 1-hour debrief: {BUNDLE_PRICE}
                          </a>
                        )}
                      </>
                    ) : (
                      <a
                        href={paymentsLink}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="w-full sm:w-auto bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold py-3.5 px-6 rounded-lg text-sm transition-all transform hover:scale-105 shadow-md flex items-center justify-center"
                      >
                        Connect With Team for Payments
                      </a>
                    )}
                  </div>

                  <div className="pt-2 space-y-1">
                    <div>
                      <a
                        href={waLink(`Hi PrepWorks team, I'm ${fullName || 'a student'}. I have a question about my Clarity Scan.`)}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="text-xs text-blue-300 hover:text-blue-200 underline font-medium"
                      >
                        Have a question first? Chat on WhatsApp
                      </a>
                    </div>
                    <p className="text-xs text-slate-400 pt-3 border-t border-slate-800">
                      We've also saved your results, so you don't need to send us anything.
                    </p>
                  </div>
                </div>
              );
            })()}

          </div>
        );
      }

      return null;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<MainApp />);
  </script>
</body>
</html>
